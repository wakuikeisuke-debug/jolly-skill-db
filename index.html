<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest">
<title>JOLLY Skill DB</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#111827;background:#f3f4f6}
body{margin:0}.app{max-width:900px;margin:auto;padding:16px 16px 80px}h1{font-size:24px;margin:4px 0 14px}
.controls{display:grid;gap:10px;position:sticky;top:0;background:#f3f4f6;padding:8px 0;z-index:10}
input,select,button{font:inherit;border:1px solid #d1d5db;border-radius:12px;padding:12px;background:#fff}
button{font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs{display:flex;gap:8px;overflow:auto}
.tabs button.active{background:#111827;color:#fff}.meta{font-size:13px;color:#6b7280;margin:8px 2px}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002}
.title{font-weight:800;font-size:18px}.sub{font-size:13px;color:#6b7280;margin-top:3px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{background:#eef2ff;border-radius:999px;padding:4px 8px;font-size:12px}.effect{line-height:1.55;white-space:pre-wrap}
.status{margin-top:10px;padding-top:10px;border-top:1px solid #eee}.small{font-size:12px;color:#6b7280}.hidden{display:none}a{color:inherit}
</style></head>
<body><div class="app">
<h1>JOLLY Skill DB</h1>
<div class="controls">
<div class="tabs"><button id="tabSkills" class="active">スキル</button><button id="tabStatuses">異常状態</button></div>
<input id="q" type="search" placeholder="スキル名・効果・タグ・異常状態を検索">
<div class="row"><select id="genre"><option value="">全ジャンル</option></select><select id="tag"><option value="">全タグ</option></select></div>
<input id="file" type="file" accept=".json,application/json">
</div>
<div class="meta" id="meta">jolly_db.json を選択してください。読み込んだデータはこの端末内に保存されます。</div>
<div id="results"></div></div>
<script>
const DBKEY="jolly-db-v1"; let data={skills:[],statuses:[]}, mode="skills"; const $=id=>document.getElementById(id);
const norm=s=>(s||"").toString().toLowerCase(); const esc=s=>(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function saveLocal(o){localStorage.setItem(DBKEY,JSON.stringify(o))} function loadLocal(){try{return JSON.parse(localStorage.getItem(DBKEY)||"null")}catch{return null}}
function buildFilters(){
 const gs=[...new Set(data.skills.flatMap(x=>(x.ジャンル||"").split(" / ")).filter(Boolean))].sort();
 const ts=[...new Set(data.skills.flatMap(x=>(x.全タグ||"").split(" / ")).filter(Boolean))].sort();
 $("genre").innerHTML='<option value="">全ジャンル</option>'+gs.map(x=>`<option>${esc(x)}</option>`).join("");
 $("tag").innerHTML='<option value="">全タグ</option>'+ts.map(x=>`<option>${esc(x)}</option>`).join("");
}
function skillCard(x){
 const tags=(x.全タグ||"").split(" / ").filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
 return `<div class="card"><div class="title">${esc(x.スキル名)}</div><div class="sub">ID ${esc(x.ID)} · ${esc(x.ジャンル)}</div>
 <div class="tags">${tags}</div><div class="effect">${esc(x.効果)}</div>${x.異常状態?`<div class="status"><b>異常状態:</b> ${esc(x.異常状態)}</div>`:""}
 ${x.URL?`<div class="small"><a href="${esc(x.URL)}" target="_blank">ゲーム内カード検索を開く</a></div>`:""}</div>`;
}
function statusCard(x){
 const rel=(x.関連スキル||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join("");
 return `<div class="card"><div class="title">${esc(x.異常状態名)}</div><div class="sub">ID ${esc(x.異常状態ID)} · 関連スキル ${x.関連スキル数||0}件</div>
 <div class="effect">${esc(x.説明)}</div><div class="status"><b>関連スキル</b><div class="tags">${rel||'<span class="small">未検出</span>'}</div></div></div>`;
}
function render(){
 const q=norm($("q").value), g=$("genre").value, t=$("tag").value, out=$("results");
 if(mode==="skills"){
  const rows=data.skills.filter(x=>{const hay=norm(x.検索用||[x.ID,x.スキル名,x.ジャンル,x.効果,x.全タグ,x.異常状態].join(" "));
   return (!q||hay.includes(q))&&(!g||(x.ジャンル||"").split(" / ").includes(g))&&(!t||(x.全タグ||"").split(" / ").includes(t));});
  $("meta").textContent=`${rows.length}件 / 全${data.skills.length}件`; out.innerHTML=rows.slice(0,500).map(skillCard).join("")||'<div class="card">該当なし</div>';
 } else {
  const rows=data.statuses.filter(x=>!q||norm([x.異常状態名,x.説明,(x.関連スキル||[]).join(" ")].join(" ")).includes(q));
  $("meta").textContent=`${rows.length}件 / 全${data.statuses.length}件`; out.innerHTML=rows.map(statusCard).join("")||'<div class="card">該当なし</div>';
 }
}
$("file").addEventListener("change",async e=>{const f=e.target.files[0]; if(!f)return; try{const o=JSON.parse(await f.text()); if(!o.skills||!o.statuses)throw Error("形式不一致"); data=o; saveLocal(o); buildFilters(); render()}catch(err){$("meta").textContent="読み込み失敗: "+err.message}});
["q","genre","tag"].forEach(id=>$(id).addEventListener(id==="q"?"input":"change",render));
$("tabSkills").onclick=()=>{mode="skills";$("tabSkills").classList.add("active");$("tabStatuses").classList.remove("active");$("genre").classList.remove("hidden");$("tag").classList.remove("hidden");render()};
$("tabStatuses").onclick=()=>{mode="statuses";$("tabStatuses").classList.add("active");$("tabSkills").classList.remove("active");$("genre").classList.add("hidden");$("tag").classList.add("hidden");render()};
const saved=loadLocal(); if(saved){data=saved;buildFilters();render()} if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
