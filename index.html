<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>JOLLY DB v5.0</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;padding:12px 12px 92px}
h1{font-size:23px;margin:3px 0 10px}.controls{position:sticky;top:0;z-index:20;background:#f3f4f6;padding:7px 0 9px;display:grid;gap:8px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:1px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button,button{border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:10px 12px;font-weight:700;color:#111827}
.tabs button{white-space:nowrap}.tabs button.active{background:#111827;color:#fff;border-color:#111827}
input,select{font:inherit;width:100%;border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:12px;color:#111827}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}
.filterPanel{border:1px solid #d1d5db;border-radius:13px;background:#fff;overflow:hidden}
.filterPanel summary{list-style:none;padding:11px 12px;font-weight:800;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.filterPanel summary::-webkit-details-marker{display:none}.filterPanel summary:after{content:"＋";font-size:18px;color:#6b7280}
.filterPanel[open] summary:after{content:"−"}.filterBody{padding:0 10px 10px;display:grid;gap:8px;border-top:1px solid #f0f0f0}
.check{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d1d5db;padding:10px;border-radius:12px;font-size:13px}.check input{width:auto}
.meta{font-size:13px;color:#6b7280;margin:9px 2px}.card{background:#fff;border-radius:16px;padding:13px;margin:9px 0;box-shadow:0 1px 3px #0002}
.cardTop{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:start}.thumb{width:58px;height:78px;border-radius:9px;object-fit:cover;background:#e5e7eb;border:1px solid #e5e7eb}
.thumb.placeholder{display:flex;align-items:center;justify-content:center;font-size:10px;color:#9ca3af;text-align:center}
.title{font-weight:800;font-size:17px;line-height:1.25}.sub,.small{font-size:12px;color:#6b7280;line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tag{border:1px solid #dbe3ff;background:#eef2ff;border-radius:999px;padding:4px 8px;font-size:12px}
.owned{background:#dcfce7;border-color:#bbf7d0}.neg{background:#fef2f2;border-color:#fecaca}.unlock{background:#fff7ed;border-color:#fed7aa}.special{background:#f5f3ff;border-color:#ddd6fe}.evo{background:#ede9fe;border-color:#c4b5fd;color:#5b21b6}
.detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #eee}.card.open .detail{display:block}
.effect{white-space:pre-wrap;line-height:1.55}.related{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.mini{border-radius:999px;padding:6px 9px;font-size:12px}
.fold{border:1px solid #e5e7eb;border-radius:12px;margin:8px 0;background:#fafafa;overflow:hidden}.fold summary{font-weight:800;padding:10px 11px;cursor:pointer}.foldBody{padding:0 11px 11px}
.heroImg{display:block;max-width:240px;width:60%;height:auto;border-radius:12px;margin:4px auto 12px;border:1px solid #e5e7eb}
.notice{font-size:12px;background:#fffbeb;border:1px solid #fde68a;padding:9px;border-radius:12px;line-height:1.45}
.statusBtn{border:1px solid #fde68a;background:#fef3c7;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700}
.judge{border-radius:10px;padding:7px 9px;font-size:12px;font-weight:700;display:inline-block;margin:3px 4px 3px 0}
.j-full{background:#fee2e2;color:#991b1b}.j-partial{background:#fef3c7;color:#92400e}.j-immune{background:#dcfce7;color:#166534}.j-out{background:#e5e7eb;color:#374151}
.reasonBox{background:#f8fafc;border-left:4px solid #94a3b8;border-radius:8px;padding:9px 10px;margin-top:8px}.reasonTitle{font-size:12px;font-weight:800;margin-bottom:3px}.reason{font-size:12px;line-height:1.55;color:#4b5563}
.affTabs{display:flex;gap:6px}.affTabs button{flex:1}.affTabs button.active{background:#374151;color:#fff}
.skillAddRow{display:grid;grid-template-columns:1fr auto;gap:7px}
.skillAddRow button{white-space:nowrap}
.selectedSkills{display:flex;flex-wrap:wrap;gap:6px}
.skillChip{display:inline-flex;align-items:center;gap:6px;border:1px solid #c7d2fe;background:#eef2ff;border-radius:999px;padding:6px 8px 6px 10px;font-size:12px;font-weight:700}
.skillChip button{border:0;background:#fff;width:22px;height:22px;border-radius:999px;padding:0;font-size:13px;line-height:20px}
.perSkillJudge{border-top:1px solid #e5e7eb;padding:8px 0}.perSkillJudge:first-child{border-top:0}

.modalBg{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:flex-end;justify-content:center}.modalBg.open{display:flex}
.modal{width:100%;max-width:700px;max-height:78vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modalHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalHead button{width:38px;height:38px;border-radius:999px;padding:0}
.quickStats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:9px 0}.quickStat{background:#f8fafc;border-radius:10px;padding:7px;text-align:center}.quickStat b{display:block;font-size:14px}.quickStat span{font-size:10px;color:#6b7280}
.back{position:fixed;right:16px;bottom:18px;width:44px;height:44px;border-radius:999px;background:#111827;color:#fff;z-index:30}
@media(max-width:560px){.row{grid-template-columns:1fr}.cardTop{grid-template-columns:52px 1fr auto}.thumb{width:52px;height:70px}.quickStats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<h1>JOLLY DB <span class="small">v5.0 iPhone UI</span></h1>
<div class="controls">
  <div class="tabs">
    <button id="tSkills" class="active">スキル</button>
    <button id="tCards">カード</button>
    <button id="tAffinity">相性</button>
    <button id="tStatuses">異常状態</button>
  </div>

  <div id="cSkills">
    <input id="sq" type="search" placeholder="スキル名・効果・タグを検索">
    <details class="filterPanel">
      <summary>検索条件</summary>
      <div class="filterBody">
        <div class="row"><select id="genre"><option value="">全ジャンル</option></select><select id="status"><option value="">全異常状態</option></select></div>
      </div>
    </details>
  </div>

  <div id="cCards" class="hidden">
    <input id="cq" type="search" placeholder="カード名・スキル名を検索">
    <details class="filterPanel">
      <summary>検索条件</summary>
      <div class="filterBody">
        <div class="row"><select id="prop"><option value="">全属性</option></select><select id="gender"><option value="">全性別</option></select></div>
        <label class="check"><input id="owned" type="checkbox">保有カードのみ</label>
        <label class="check"><input id="ownedPriority" type="checkbox" checked>保有カードを上に表示</label>
      </div>
    </details>
  </div>

  <div id="cAffinity" class="hidden">
    <div class="affTabs"><button id="affByCard" class="active">カードから探す</button><button id="affBySkill">スキルから探す</button></div>

    <div id="affCardPane">
      <input id="aq" type="search" list="cardNames" placeholder="対象カード名を入力・選択"><datalist id="cardNames"></datalist>
      <details class="filterPanel">
        <summary>絞り込み</summary>
        <div class="filterBody">
          <div class="row"><select id="amatch"><option value="match">対象になるスキル</option><option value="outside">対象外のスキル</option></select><select id="adir"><option value="">効果方向すべて</option><option value="positive_for_user">使用側に有利</option><option value="negative_for_user">使用側に不利</option><option value="neutral_or_unknown">中立・未分類</option></select></div>
          <label class="check"><input id="aowned" type="checkbox">スキル保有元を保有カードだけに絞る</label>
        </div>
      </details>
    </div>

    <div id="affSkillPane" class="hidden">
      <div class="skillAddRow">
        <input id="asq" type="search" list="skillNames" placeholder="スキル名を入力・選択"><datalist id="skillNames"></datalist>
        <button id="addAffinitySkill">追加</button>
      </div>
      <div class="selectedSkills" id="selectedAffinitySkills"></div>
      <details class="filterPanel">
        <summary>実効判定・並び順</summary>
        <div class="filterBody">
          <select id="impactFilter">
            <option value="">判定：すべて</option>
            <option value="safe_all">全スキルが効かない（実質無効・条件外）</option>
            <option value="immune_all">全スキルに実質無効</option>
            <option value="some_effect">一部のスキルだけ効く</option>
            <option value="full_all">全スキルが完全に有効</option>
          </select>
          <div class="row">
            <select id="defOwned"><option value="">全カード</option><option value="owned">保有カードのみ</option></select>
            <select id="affinitySort">
              <option value="judgement">判定順</option>
              <option value="cost_asc">Cost 昇順</option>
              <option value="cost_desc">Cost 降順</option>
              <option value="property">属性順（戦→獣→魔→飛）</option>
            </select>
          </div>
          <label class="check"><input id="impactOwnedPriority" type="checkbox" checked>保有カードを上に表示</label>
        </div>
      </details>
      <div class="notice">複数スキルはANDで判定します。「全スキルが効かない」では、選択したすべてのスキルが「実質無効」または「条件外」のカードだけを表示します。</div>
    </div>
  </div>

  <div id="cStatuses" class="hidden"><input id="stq" type="search" placeholder="異常状態名・説明を検索"></div>
</div>

<div class="meta" id="meta">jolly_card_db_latest.json を読み込み中…</div>
<div id="results"></div>
</div>

<div class="modalBg" id="statusModal">
  <div class="modal">
    <div class="modalHead"><div><div class="title" id="smTitle"></div><div class="sub" id="smSub"></div></div><button id="smClose">×</button></div>
    <div class="effect" id="smBody" style="margin-top:12px"></div>
    <div class="related" id="smSkills"></div>
  </div>
</div>

<button class="back" id="back">↑</button>

<script>
const DB='jolly_card_db_latest.json';
const $=id=>document.getElementById(id);
const norm=s=>(s??'').toString().normalize('NFKC').toLowerCase();
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data={cards:[],skills:[],supplemental_skills:[],statuses:[]},mode='skills',affinityMode='card';
let selectedAffinitySkillNames=[];

/*
  タブごとの表示位置を記憶する。
  スキル→カード→スキルのように戻った時、
  直前に見ていた位置へ復帰する。
*/
const scrollByMode={
  skills:0,
  cards:0,
  affinity:0,
  statuses:0
};

function restoreModeScroll(m){
  const y=Number(scrollByMode[m]||0);

  /*
    render()でDOMを入れ替えた次の描画タイミングで
    スクロール位置を復元する。
  */
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      window.scrollTo({
        top:y,
        left:0,
        behavior:'auto'
      });
    });
  });
}

const sname=s=>s?.スキル名||s?.skill_name||s?.original_skill_name||'';
const seffect=s=>s?.効果||s?.effect||s?.card_effect_raw||'';
const sgenre=s=>s?.ジャンル||s?.genre||'';
const sid=s=>s?.ID||s?.skill_id||'';
const srules=s=>Array.isArray(s?.target_rules)?s.target_rules:[];
const stags=s=>Array.isArray(s?.tags)?s.tags:String(s?.全タグ||'').split(' / ').filter(Boolean);
const sstatuses=s=>Array.isArray(s?.statuses)?s.statuses:String(s?.異常状態||'').split(' / ').filter(Boolean);
const allSkills=()=>[...(data.skills||[]),...(data.supplemental_skills||[])];
function allSpecialSkills(){
  const out=[];
  for(const c of (data.cards||[])){
    for(const sk of (c.special_skills||[])){
      out.push({...sk,cards:[{card_name:c.card_name,owned:!!c.owned}],genre:'神格・魔格特殊スキル'});
    }
  }
  return out;
}
function searchableSkills(){return [...allSkills(),...allSpecialSkills()]}

function statusNames(){return new Set((data.statuses||[]).map(x=>x.異常状態名).filter(Boolean))}
function quotedStatuses(text){
  const known=statusNames(),out=[];
  for(const m of String(text||'').matchAll(/[「『]([^」』]+)[」』]/g)){if(known.has(m[1]))out.push(m[1])}
  return [...new Set(out)];
}
function inflictedStatuses(s){return [...new Set([...sstatuses(s),...quotedStatuses(seffect(s))])]}
function cardSkills(c){
  const a=[...(c.skills||[]),...(c.unlock_skills||[]),...(c.special_skills||[])];
  for(const x of (c.skill_changes||[])){if(x.to_skill)a.push(x.to_skill)}
  return a;
}
function allCardSkillNames(c){
  const a=[];
  (c.skills||[]).forEach(s=>a.push(sname(s)));
  (c.unlock_skills||[]).forEach(s=>a.push(sname(s)));
  (c.special_skills||[]).forEach(s=>a.push(sname(s)));
  (c.skill_changes||[]).forEach(x=>{if(x.from_skill)a.push(sname(x.from_skill));if(x.to_skill)a.push(sname(x.to_skill))});
  return a.filter(Boolean);
}
function immunitySources(c){
  const out=new Map();
  function add(status,label){
    if(!out.has(status))out.set(status,[]);
    if(!out.get(status).includes(label))out.get(status).push(label);
  }
  for(const sk of [...(c.skills||[]),...(c.unlock_skills||[])]){
    if(sgenre(sk)!=='潜在能力系')continue;
    const ef=seffect(sk);
    if(!ef.includes('受け付けない'))continue;
    for(const st of quotedStatuses(ef))add(st,`潜在能力「${sname(sk)}」`);
  }
  for(const x of (c.skill_changes||[])){
    const sk=x.to_skill;
    if(!sk||sgenre(sk)!=='潜在能力系')continue;
    const ef=seffect(sk);
    if(!ef.includes('受け付けない'))continue;
    for(const st of quotedStatuses(ef))add(st,`変化後潜在「${sname(sk)}」`);
  }
  for(const sk of (c.special_skills||[])){
    const statuses=Array.isArray(sk.immunity_statuses)&&sk.immunity_statuses.length
      ? sk.immunity_statuses
      : (seffect(sk).includes('受け付けない')?quotedStatuses(seffect(sk)):[]);
    for(const st of statuses)add(st,`特殊スキル「${sname(sk)}」`);
  }
  return out;
}
function latentImmunities(c){return new Set(immunitySources(c).keys())}
function hasAbnormalGuard(c){return cardSkills(c).some(sk=>stags(sk).some(t=>String(t).includes('異常ガード'))||seffect(sk).includes('異常ガード'))}
function bypassesAbnormalGuard(s){return /異常ガード[^。]*無効/.test(seffect(s))||seffect(s).includes('[異常ガード]類の効果を無効')}

function imageHtml(c,large=false){
  if(!c?.image_url)return large?'':'<div class="thumb placeholder">画像なし</div>';
  if(large)return `<img class="heroImg" src="${esc(c.image_url)}" alt="${esc(c.card_name)}" loading="lazy" onerror="this.style.display='none'">`;
  return `<img class="thumb" src="${esc(c.image_url)}" alt="${esc(c.card_name)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;thumb placeholder&quot;>画像なし</div>'">`;
}
function statusButton(name){return `<button class="statusBtn" onclick="openStatus('${esc(name)}')">${esc(name)}</button>`}
function openStatus(name){
  const x=(data.statuses||[]).find(s=>s.異常状態名===name);if(!x)return;
  $('smTitle').textContent=name;
  $('smSub').textContent=`ID ${x.異常状態ID||''} · 関連スキル ${x.関連スキル数||0}件`;
  $('smBody').textContent=x.説明||'';
  $('smSkills').innerHTML=(x.関連スキル||[]).map(n=>`<button class="mini" onclick="closeStatus();jumpSkillName('${esc(n)}')">${esc(n)}</button>`).join('')||'<span class="small">関連スキルなし</span>';
  $('statusModal').classList.add('open');
}
function closeStatus(){$('statusModal').classList.remove('open')}
function jumpSkillName(name){setMode('skills');$('sq').value=name;render();scrollTo({top:0,behavior:'smooth'})}
function dirTag(d){return d==='positive_for_user'?'<span class="tag owned">使用側に有利</span>':d==='negative_for_user'?'<span class="tag neg">使用側に不利</span>':'<span class="tag">中立・未分類</span>'}

function setMode(m){
  /*
    今いるタブの位置を保存。
    同じタブを押した場合は位置を動かさない。
  */
  if(m===mode){
    return;
  }

  scrollByMode[mode]=window.scrollY;

  mode=m;

  for(const x of ['Skills','Cards','Affinity','Statuses']){
    $('t'+x).classList.toggle(
      'active',
      m===x.toLowerCase()
    );

    $('c'+x).classList.toggle(
      'hidden',
      m!==x.toLowerCase()
    );
  }

  render();
  restoreModeScroll(m);
}
function build(){
  const gs=[...new Set(searchableSkills().map(sgenre).filter(Boolean))].sort();
  const ss=[...new Set((data.statuses||[]).map(x=>x.異常状態名).filter(Boolean))].sort();
  const ps=data.search_metadata?.properties||[...new Set(data.cards.map(x=>x.property).filter(Boolean))];
  const ge=data.search_metadata?.genders||[...new Set(data.cards.map(x=>x.gender).filter(Boolean))];
  $('genre').innerHTML='<option value="">全ジャンル</option>'+gs.map(x=>`<option>${esc(x)}</option>`).join('');
  $('status').innerHTML='<option value="">全異常状態</option>'+ss.map(x=>`<option>${esc(x)}</option>`).join('');
  $('prop').innerHTML='<option value="">全属性</option>'+ps.map(x=>`<option>${esc(x)}</option>`).join('');
  $('gender').innerHTML='<option value="">全性別</option>'+ge.map(x=>`<option>${esc(x)}</option>`).join('');
  $('cardNames').innerHTML=data.cards.map(c=>`<option value="${esc(c.card_name)}"></option>`).join('');
  $('skillNames').innerHTML=searchableSkills().map(x=>`<option value="${esc(sname(x))}"></option>`).join('');
}
function findSkillByName(name){return searchableSkills().find(x=>sname(x)===name)}
function renderAffinitySkillChips(){
  $('selectedAffinitySkills').innerHTML=selectedAffinitySkillNames.map((name,i)=>`<span class="skillChip">${esc(name)}<button onclick="removeAffinitySkill(${i})">×</button></span>`).join('');
}
function addAffinitySkill(){
  const name=$('asq').value.trim();
  if(!name)return;
  if(!findSkillByName(name)){alert('スキル名が見つかりません。候補から選択してください。');return}
  if(!selectedAffinitySkillNames.includes(name))selectedAffinitySkillNames.push(name);
  $('asq').value='';
  renderAffinitySkillChips();
  render();
}
function removeAffinitySkill(i){
  selectedAffinitySkillNames.splice(i,1);
  renderAffinitySkillChips();
  render();
}
function sortOwnedFirst(rows,enabled=true,getter=x=>x){
  if(!enabled)return rows;
  return rows.sort((a,b)=>(Number(!!getter(b).owned)-Number(!!getter(a).owned))||String(getter(a).card_name||'').localeCompare(String(getter(b).card_name||''),'ja'));
}
function holders(s,ownedOnly=false){
  let a=(s.cards||[]).filter(x=>!ownedOnly||x.owned);
  a=sortOwnedFirst(a,true);
  return a.map(x=>`<button class="mini" onclick="jumpCard('${esc(x.card_name)}')">${x.owned?'★ ':''}${esc(x.card_name)}${x.required_item?` / ${esc(x.required_item)}`:''}</button>`).join('')||'<span class="small">なし</span>';
}

function ruleLabel(r){
  if(r.target_type==='property')return `属性が「${r.target_value}」`;
  if(r.target_type==='gender')return `性別が「${r.target_value}」`;
  if(r.target_type==='specific_card')return `特定カード「${r.target_value}」`;
  if(r.target_type==='skill_name_contains')return `「${r.target_value}」系スキルを保有`;
  if(r.target_type==='status')return `状態「${r.target_value}」`;
  if(r.target_type==='position')return `配置条件「${r.target_value}」`;
  if(r.target_type==='named_target')return `対象名「${r.target_value}」`;
  return `${r.target_type}: ${r.target_value}`;
}
function evaluable(r){return ['property','gender','specific_card','skill_name_contains'].includes(r.target_type)}
function matchRule(c,r){
  if(r.target_type==='property')return c.property===r.target_value;
  if(r.target_type==='gender')return c.gender===r.target_value;
  if(r.target_type==='specific_card')return String(c.card_no)===String(r.target_card_no||'')||c.card_name===r.target_value;
  if(r.target_type==='skill_name_contains')return allCardSkillNames(c).some(n=>n.includes(String(r.target_value||'')));
  return false;
}
function matchedReasons(c,s){
  const rs=srules(s).filter(evaluable);
  return rs.filter(r=>matchRule(c,r)).map(ruleLabel);
}
function outsideReasons(c,s){
  const rs=srules(s).filter(evaluable);
  return rs.filter(r=>!matchRule(c,r)).map(r=>`${ruleLabel(r)}に該当しない`);
}

function skillCard(s){
  const sts=inflictedStatuses(s).map(statusButton).join('');
  return `<div class="card">
    <div class="cardTop">
      <div class="thumb placeholder">SKILL</div>
      <div><div class="title">${esc(sname(s))}</div><div class="sub">${sid(s)?'ID '+esc(sid(s))+' · ':''}${esc(sgenre(s))}</div><div class="tags">${dirTag(s.effect_direction)}${sts}</div></div>
      <button onclick="toggle(this)">詳細</button>
    </div>
    <div class="effect">${esc(seffect(s))}</div>
    <div class="detail">
      <details class="fold"><summary>対象条件</summary><div class="foldBody">${srules(s).map(r=>`<div class="small">・${esc(ruleLabel(r))} / ${esc(r.relation||'')}</div>`).join('')||'<span class="small">静的な対象条件なし</span>'}</div></details>
      <details class="fold"><summary>このスキルを使えるカード</summary><div class="foldBody"><div class="related">${holders(s)}</div></div></details>
    </div>
  </div>`;
}
function skillBlock(s,prefix='',special=false){
  const sts=inflictedStatuses(s).map(statusButton).join('');
  const imm=(s.immunity_statuses||[]).map(statusButton).join('');
  const evo=special?` <span class="tag evo">${s.evolution_type==='divine'?'神格':'魔格'}特殊</span>`:'';
  return `<div style="padding:8px 0;border-bottom:1px solid #eee"><b>${esc(prefix)}${esc(sname(s))}</b>${evo}${s.required_item_name?` <span class="tag unlock">必要: ${esc(s.required_item_name)}</span>`:''}<div class="tags">${sts}${imm}</div><div class="small">${esc(seffect(s))}</div></div>`;
}
function skillChangeBlock(x){
  const from=x.from_skill||{};
  const to=x.to_skill||{};

  const fromName=sname(from);
  const toName=sname(to);
  const toEffect=seffect(to);

  const sts=to
    ? inflictedStatuses(to)
        .map(statusButton)
        .join('')
    : '';

  return `
    <div style="
      padding:10px 0;
      border-bottom:1px solid #eee
    ">

      <div>
        <b>
          🔄 ${esc(fromName)}
          → ${esc(toName)}
        </b>

        ${
          x.required_item_name
          ? `
            <span class="tag unlock">
              必要: ${esc(x.required_item_name)}
            </span>
          `
          : ''
        }
      </div>

      ${
        sts
        ? `<div class="tags">${sts}</div>`
        : ''
      }

      <div class="small"
           style="
             margin-top:7px;
             line-height:1.55;
             white-space:pre-wrap
           ">
        <b>変化後スキル効果</b><br>
        ${
          toEffect
          ? esc(toEffect)
          : '<span style="color:#9ca3af">説明文なし</span>'
        }
      </div>

    </div>
  `;
}

function cardCard(c){
  const base=(c.skills||[]).map(s=>skillBlock(s)).join('');

  /*
    アイテム解放はskillBlockを使うため、
    解放後スキルの効果説明も表示する。
  */
  const un=(c.unlock_skills||[])
    .map(s=>skillBlock(s,'🔓 '))
    .join('');

  const sp=(c.special_skills||[])
    .map(s=>skillBlock(s,'✨ ',true))
    .join('');

  /*
    アイテム変化は「変化後」の効果説明を表示。
  */
  const ch=(c.skill_changes||[])
    .map(skillChangeBlock)
    .join('');
  return `<div class="card">
    <div class="cardTop">
      ${imageHtml(c)}
      <div><div class="title">${c.owned?'★ ':''}${esc(c.card_name)}</div><div class="sub">No.${esc(c.card_no)} · ${esc(c.property)} · ${esc(c.gender||'?')} · ${esc(c.rarity_name||'')}</div><div class="tags">${c.owned?'<span class="tag owned">保有</span>':''}<span class="tag">${esc(c.property)}</span></div></div>
      <button onclick="toggle(this)">詳細</button>
    </div>
    <div class="detail">
      ${imageHtml(c,true)}
      <div class="quickStats"><div class="quickStat"><span>HP</span><b>${esc(c.hp_min)}〜${esc(c.hp_max)}</b></div><div class="quickStat"><span>攻撃</span><b>${esc(c.attack_min)}〜${esc(c.attack_max)}</b></div><div class="quickStat"><span>速さ</span><b>${esc(c.speed_min)}〜${esc(c.speed_max)}</b></div><div class="quickStat"><span>Cost</span><b>${esc(c.cost??'')}</b></div></div>
      ${c.description?`<details class="fold"><summary>カード説明</summary><div class="foldBody effect">${esc(c.description)}</div></details>`:''}
      <details class="fold" open><summary>通常スキル ${(c.skills||[]).length}件</summary><div class="foldBody">${base||'<div class="small">なし</div>'}</div></details>
      ${sp?`<details class="fold" open><summary>${c.evolution_type==='divine'?'神格':'魔格'}特殊スキル ${(c.special_skills||[]).length}件</summary><div class="foldBody">${sp}</div></details>`:''}
      ${un?`<details class="fold"><summary>アイテム解放 ${(c.unlock_skills||[]).length}件</summary><div class="foldBody"><div class="small" style="margin:2px 0 6px">アイテム使用で解放されるスキルと、その効果です。</div>${un}</div></details>`:''}
      ${ch?`<details class="fold"><summary>アイテム変化 ${(c.skill_changes||[]).length}件</summary><div class="foldBody"><div class="small" style="margin:2px 0 6px">アイテム使用後のスキルと、変化後の効果です。</div>${ch}</div></details>`:''}
    </div>
  </div>`;
}

function affinity(){
  const q=$('aq').value.trim(),alias=data.search_aliases?.cards?.[q],name=alias?.canonical||q,target=data.cards.find(c=>c.card_name===name||c.card_name===q);
  if(!q)return {target:null,rows:[],empty:true};
  if(!target)return {target:null,rows:[],empty:false};
  const want=$('amatch').value==='match',dir=$('adir').value,own=$('aowned').checked,rows=[];
  for(const s of allSkills()){
    const rules=srules(s).filter(evaluable);if(!rules.length)continue;
    const m=rules.some(r=>matchRule(target,r));if(m!==want)continue;
    if(dir&&s.effect_direction!==dir)continue;
    let h=(s.cards||[]).filter(x=>!own||x.owned);if(own&&!h.length)continue;
    h=sortOwnedFirst(h,true);
    rows.push({s,h,reasons:want?matchedReasons(target,s):outsideReasons(target,s)});
  }
  return {target,rows,empty:false};
}

function staticScopeRules(s){return srules(s).filter(evaluable)}
function scopeApplies(c,s){const rules=staticScopeRules(s);if(!rules.length)return true;return rules.some(r=>matchRule(c,r))}
function impactOnCard(c,s){
  if(!scopeApplies(c,s))return {kind:'out',label:'条件外',reason:outsideReasons(c,s).join('／')||'属性・性別などの対象条件に該当しない',blocked:[],applied:[]};
  const inf=inflictedStatuses(s);
  const baseReason=matchedReasons(c,s).join('／');
  if(!inf.length)return {kind:'full',label:'対象',reason:baseReason||'静的な対象条件に該当',blocked:[],applied:[]};
  const sourceMap=immunitySources(c),blocked=inf.filter(x=>sourceMap.has(x)),applied=inf.filter(x=>!sourceMap.has(x));
  const guard=hasAbnormalGuard(c),bypass=bypassesAbnormalGuard(s);
  let guardNote='';
  if(guard&&bypass)guardNote='。異常ガード類はこのスキルに無効化される';
  else if(guard&&!bypass)guardNote='。異常ガード系スキルも保有';
  const scopeNote=baseReason?`${baseReason}。`:'';
  const blockReason=blocked.map(st=>`${st}（${sourceMap.get(st).join(' / ')}）`).join('、');
  if(applied.length===0)return {kind:'immune',label:'実質無効',reason:`${scopeNote}${blockReason} により全て無効${guardNote}`,blocked,applied};
  if(blocked.length)return {kind:'partial',label:'一部のみ有効',reason:`${scopeNote}無効: ${blockReason} / 受ける: ${applied.join('・')}${guardNote}`,blocked,applied};
  return {kind:'full',label:'完全に有効',reason:`${scopeNote}${inf.join('・')} をすべて受ける${guardNote}`,blocked,applied};
}
function impactBadge(x){const cls=x.kind==='full'?'j-full':x.kind==='partial'?'j-partial':x.kind==='immune'?'j-immune':'j-out';return `<span class="judge ${cls}">${esc(x.label)}</span>`}
function aggregateImpact(impacts){
  const kinds=impacts.map(x=>x.impact.kind);
  if(kinds.every(k=>k==='immune'))return {kind:'immune',label:'全スキルに実質無効'};
  if(kinds.every(k=>k==='immune'||k==='out'))return {kind:'out',label:'全スキルが効かない'};
  if(kinds.every(k=>k==='full'))return {kind:'full',label:'全スキルが完全に有効'};
  if(kinds.some(k=>k==='full'||k==='partial'))return {kind:'partial',label:'一部のスキルだけ効く'};
  return {kind:'partial',label:'判定が混在'};
}
function aggregateFilterPass(impacts,filter){
  if(!filter)return true;
  const kinds=impacts.map(x=>x.impact.kind);
  if(filter==='safe_all')return kinds.every(k=>k==='immune'||k==='out');
  if(filter==='immune_all')return kinds.every(k=>k==='immune');
  if(filter==='full_all')return kinds.every(k=>k==='full');
  if(filter==='some_effect')return kinds.some(k=>k==='full'||k==='partial')&&!kinds.every(k=>k==='full');
  return true;
}
function affinityBySkill(){
  const skills=selectedAffinitySkillNames.map(findSkillByName).filter(Boolean);
  if(!skills.length)return {skills:[],rows:[],empty:true};
  const filter=$('impactFilter').value,ownedOnly=$('defOwned').value==='owned',rows=[];
  for(const c of data.cards){
    if(ownedOnly&&!c.owned)continue;
    const impacts=skills.map(skill=>({skill,impact:impactOnCard(c,skill)}));
    if(!aggregateFilterPass(impacts,filter))continue;
    rows.push({c,impacts,aggregate:aggregateImpact(impacts)});
  }
  const ownedPriority=$('impactOwnedPriority').checked;
  const sort=$('affinitySort').value;
  const judgementOrder={'全スキルに実質無効':0,'全スキルが効かない':1,'一部のスキルだけ効く':2,'判定が混在':3,'全スキルが完全に有効':4};
  const propertyOrder={戦:0,獣:1,魔:2,飛:3,船:4};
  rows.sort((a,b)=>{
    if(ownedPriority){
      const d=Number(!!b.c.owned)-Number(!!a.c.owned);
      if(d)return d;
    }
    if(sort==='cost_asc'){
      const d=(Number(a.c.cost)||0)-(Number(b.c.cost)||0);if(d)return d;
    }else if(sort==='cost_desc'){
      const d=(Number(b.c.cost)||0)-(Number(a.c.cost)||0);if(d)return d;
    }else if(sort==='property'){
      const d=(propertyOrder[a.c.property]??99)-(propertyOrder[b.c.property]??99);if(d)return d;
    }else{
      const d=(judgementOrder[a.aggregate.label]??99)-(judgementOrder[b.aggregate.label]??99);if(d)return d;
    }
    return a.c.card_name.localeCompare(b.c.card_name,'ja');
  });
  return {skills,rows,empty:false};
}
function impactCard(x){
  const statuses=[...new Set(x.impacts.flatMap(y=>inflictedStatuses(y.skill)))].map(statusButton).join('');
  const perSkill=x.impacts.map(y=>`<div class="perSkillJudge"><div><b>${esc(sname(y.skill))}</b> ${impactBadge(y.impact)}</div><div class="reason">${esc(y.impact.reason)}</div></div>`).join('');
  return `<div class="card">
    <div class="cardTop">
      ${imageHtml(x.c)}
      <div>
        <div class="title">${x.c.owned?'★ ':''}${esc(x.c.card_name)}</div>
        <div class="sub">No.${esc(x.c.card_no)} · ${esc(x.c.property)} · ${esc(x.c.gender||'?')} · Cost ${esc(x.c.cost??'')}</div>
        <div class="tags">${impactBadge(x.aggregate)}${x.c.owned?'<span class="tag owned">保有</span>':''}${statuses}</div>
      </div>
      <button onclick="jumpCard('${esc(x.c.card_name)}')">カード</button>
    </div>
    <div class="reasonBox"><div class="reasonTitle">選択した各スキルの判定</div>${perSkill}</div>
  </div>`;
}
function affinitySkillCard(x){
  return `<div class="card">
    <div class="cardTop">
      <div class="thumb placeholder">SKILL</div>
      <div><div class="title">${esc(sname(x.s))}</div><div class="sub">${esc(sgenre(x.s))} · 使用可能 ${x.h.length}カード</div><div class="tags">${dirTag(x.s.effect_direction)}${inflictedStatuses(x.s).map(statusButton).join('')}</div></div>
      <button onclick="toggle(this)">詳細</button>
    </div>
    <div class="reasonBox"><div class="reasonTitle">なぜ${$('amatch').value==='match'?'対象':'対象外'}？</div><div class="reason">${esc(x.reasons.join('／')||'静的条件による判定')}</div></div>
    <div class="effect">${esc(seffect(x.s))}</div>
    <div class="detail"><details class="fold" open><summary>このスキルを使えるカード</summary><div class="foldBody"><div class="related">${x.h.map(h=>`<button class="mini" onclick="jumpCard('${esc(h.card_name)}')">${h.owned?'★ ':''}${esc(h.card_name)}</button>`).join('')||'<span class="small">なし</span>'}</div></div></details></div>
  </div>`;
}

function render(){
  const out=$('results');
  if(mode==='skills'){
    const q=norm($('sq').value),g=$('genre').value,st=$('status').value;
    const rows=searchableSkills().filter(s=>(!q||norm([sname(s),seffect(s),sgenre(s),s.全タグ,s.異常状態,(s.immunity_statuses||[]).join(' ')].join(' ')).includes(q))&&(!g||sgenre(s)===g)&&(!st||String(s.異常状態||'').split(' / ').includes(st)||(s.immunity_statuses||[]).includes(st)));
    $('meta').textContent=`${rows.length}件 / 全${searchableSkills().length}件`;
    out.innerHTML=rows.slice(0,800).map(skillCard).join('')||'<div class="card">該当なし</div>';
  }else if(mode==='cards'){
    const q=norm($('cq').value),p=$('prop').value,g=$('gender').value,o=$('owned').checked;
    let rows=data.cards.filter(c=>(!q||norm([c.card_name,(c.aliases||[]).join(' '),c.description,allCardSkillNames(c).join(' ')].join(' ')).includes(q))&&(!p||c.property===p)&&(!g||c.gender===g)&&(!o||c.owned));
    rows=sortOwnedFirst(rows,$('ownedPriority').checked);
    $('meta').textContent=`${rows.length}件 / 全${data.cards.length}件`;
    out.innerHTML=rows.slice(0,500).map(cardCard).join('')||'<div class="card">該当なし</div>';
  }else if(mode==='affinity'){
    if(affinityMode==='skill'){
      const a=affinityBySkill();
      if(a.empty){$('meta').textContent='スキルを1つ以上追加してください';out.innerHTML='';return}
      const names=a.skills.map(s=>sname(s));
      $('meta').innerHTML=`${names.length}スキル AND検索 · ${a.rows.length}カード<br><span class="small">${names.map(esc).join(' ＋ ')}</span>`;
      out.innerHTML=a.rows.slice(0,700).map(impactCard).join('')||'<div class="card">該当なし</div>';
      return;
    }
    const a=affinity();
    if(a.empty){$('meta').textContent='対象カードを選択してください';out.innerHTML='';return}
    if(!a.target){$('meta').textContent='カード名が見つかりません';out.innerHTML='';return}
    $('meta').textContent=`対象: ${a.target.card_name}（${a.target.property}/${a.target.gender||'?'}） · ${a.rows.length}スキル`;
    out.innerHTML=a.rows.slice(0,500).map(affinitySkillCard).join('')||'<div class="card">該当なし</div>';
  }else{
    const q=norm($('stq').value),rows=(data.statuses||[]).filter(x=>!q||norm([x.異常状態名,x.説明,(x.関連スキル||[]).join(' ')].join(' ')).includes(q));
    $('meta').textContent=`${rows.length}件 / 全${data.statuses.length}件`;
    out.innerHTML=rows.map(x=>`<div class="card" onclick="openStatus('${esc(x.異常状態名)}')"><div class="title">${esc(x.異常状態名)}</div><div class="effect">${esc(x.説明)}</div><div class="small" style="margin-top:6px">タップで関連スキルを表示</div></div>`).join('');
  }
}

function toggle(b){const c=b.closest('.card');c.classList.toggle('open');b.textContent=c.classList.contains('open')?'閉じる':'詳細'}
function jumpCard(name){setMode('cards');$('cq').value=name;$('prop').value='';$('gender').value='';$('owned').checked=false;render();scrollTo({top:0,behavior:'smooth'})}

['sq','cq','aq','stq'].forEach(id=>$(id).addEventListener('input',render));
$('asq').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addAffinitySkill()}});
['genre','status','prop','gender','amatch','adir','impactFilter','defOwned','affinitySort'].forEach(id=>$(id).addEventListener('change',render));
['owned','ownedPriority','aowned','impactOwnedPriority'].forEach(id=>$(id).addEventListener('change',render));
$('tSkills').onclick=()=>setMode('skills');$('tCards').onclick=()=>setMode('cards');$('tAffinity').onclick=()=>setMode('affinity');$('tStatuses').onclick=()=>setMode('statuses');
$('back').onclick=()=>scrollTo({top:0,behavior:'smooth'});
$('affByCard').onclick=()=>{affinityMode='card';$('affByCard').classList.add('active');$('affBySkill').classList.remove('active');$('affCardPane').classList.remove('hidden');$('affSkillPane').classList.add('hidden');render()};
$('affBySkill').onclick=()=>{affinityMode='skill';$('affBySkill').classList.add('active');$('affByCard').classList.remove('active');$('affSkillPane').classList.remove('hidden');$('affCardPane').classList.add('hidden');render()};
$('addAffinitySkill').onclick=addAffinitySkill;
$('smClose').onclick=closeStatus;$('statusModal').onclick=e=>{if(e.target===$('statusModal'))closeStatus()};

fetch(DB+'?t='+Date.now(),{cache:'no-store'})
.then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()})
.then(o=>{data=o;build();render()})
.catch(e=>{$('meta').textContent='読込失敗: '+e.message+'。index.htmlと同じ場所に jolly_card_db_latest.json を置いてください。'});
</script>
