<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>JOLLY Skill DB v2.1</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;padding:14px 14px 90px}h1{font-size:24px;margin:4px 0 12px}.controls{position:sticky;top:0;z-index:20;background:#f3f4f6;padding:8px 0 10px;display:grid;gap:9px}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;white-space:nowrap}.tabs button.active{background:#111827;color:#fff}button,input,select{font:inherit}input[type=search],select{width:100%;border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tagSelectorBtn{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:12px;text-align:left}.tagSelectorBtn .label{font-weight:700}.tagSelectorBtn .count{font-size:13px;color:#6b7280}.modalBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}.modalBackdrop.open{display:flex}.tagModal{width:100%;max-width:700px;background:#f9fafb;border-radius:20px 20px 0 0;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 -8px 30px #0003}.modalHeader{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e5e7eb;background:#fff;border-radius:20px 20px 0 0}.modalTitle{font-weight:800;font-size:18px}.closeBtn{border:0;background:#f3f4f6;border-radius:999px;width:34px;height:34px;font-weight:800}.modalBody{padding:14px;overflow:auto}.modalActions{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #e5e7eb;background:#fff}.modalActions button{flex:1;border:1px solid #d1d5db;border-radius:12px;padding:12px;background:#fff;font-weight:700}.modalActions .done{background:#111827;color:#fff;border-color:#111827}.tagGrid{display:flex;flex-wrap:wrap;gap:8px}.tagChoice{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:9px 12px;font-size:13px}.tagChoice.active{background:#111827;color:#fff;border-color:#111827}.selectedSummary{font-size:13px;color:#6b7280;margin-bottom:10px}.meta{font-size:13px;color:#6b7280;margin:8px 2px}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002}.cardHeader{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-weight:800;font-size:18px}.sub{font-size:13px;color:#6b7280;margin-top:3px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tag{background:#eef2ff;border-radius:999px;padding:4px 8px;font-size:12px;border:1px solid #dbe3ff}.statusTag{background:#fef3c7;border-color:#fde68a}.effect{line-height:1.55;white-space:pre-wrap}.detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #eee}.card.open .detail{display:block}.toggle{border:0;background:transparent;font-weight:700;font-size:13px;padding:4px 0}.small{font-size:12px;color:#6b7280}.linkBtn{display:inline-block;margin-top:8px;padding:8px 10px;border-radius:10px;background:#f3f4f6;text-decoration:none;color:#111827;font-size:13px}.hidden{display:none!important}.related{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.related button{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:6px 9px;font-size:12px}.backTop{position:fixed;right:16px;bottom:18px;border:0;border-radius:999px;background:#111827;color:#fff;width:44px;height:44px;font-weight:800}@media(max-width:560px){.row{grid-template-columns:1fr}}
</style></head><body><div class="app"><h1>JOLLY Skill DB <span style="font-size:12px;color:#6b7280;font-weight:500">v2.1</span></h1><div class="controls"><div class="tabs"><button id="tabSkills" class="active">スキル</button><button id="tabStatuses">異常状態</button></div><input id="q" type="search" placeholder="スキル名・効果・タグ・異常状態を検索"><div id="skillFilters"><div class="row"><select id="genre"><option value="">全ジャンル</option></select><select id="status"><option value="">全異常状態</option></select></div><button id="openTagModal" class="tagSelectorBtn"><span class="label">タグを選択</span><span class="count" id="tagCount">0個選択中 ＞</span></button></div><input id="file" type="file" accept=".json,application/json"></div><div class="meta" id="meta">jolly_db.json を選択してください。</div><div id="results"></div></div><div class="modalBackdrop" id="tagModalBackdrop" aria-hidden="true"><div class="tagModal" role="dialog" aria-modal="true"><div class="modalHeader"><div class="modalTitle">タグを選択</div><button class="closeBtn" id="closeTagModal">×</button></div><div class="modalBody"><div class="selectedSummary" id="selectedSummary">タグ未選択</div><div class="tagGrid" id="tagGrid"></div></div><div class="modalActions"><button id="clearTags">すべて解除</button><button id="doneTags" class="done">完了</button></div></div></div><button class="backTop" id="backTop">↑</button>
<script>
const DBKEY='jolly-db-v2';let data={skills:[],statuses:[]},mode='skills',selectedTags=new Set();const $=id=>document.getElementById(id),norm=s=>(s||'').toString().toLowerCase(),esc=s=>(s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveLocal(o){localStorage.setItem(DBKEY,JSON.stringify(o))}function loadLocal(){try{return JSON.parse(localStorage.getItem(DBKEY)||'null')}catch{return null}}
function buildFilters(){const gs=[...new Set(data.skills.flatMap(x=>(x.ジャンル||'').split(' / ')).filter(Boolean))].sort();const ts=[...new Set(data.skills.flatMap(x=>(x.全タグ||'').split(' / ')).filter(Boolean))].sort();const ss=[...new Set(data.statuses.map(x=>x.異常状態名).filter(Boolean))].sort();$('genre').innerHTML='<option value="">全ジャンル</option>'+gs.map(x=>`<option>${esc(x)}</option>`).join('');$('status').innerHTML='<option value="">全異常状態</option>'+ss.map(x=>`<option>${esc(x)}</option>`).join('');$('tagGrid').innerHTML=ts.map(x=>`<button class="tagChoice" data-tag="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('#tagGrid .tagChoice').forEach(b=>b.onclick=()=>{const t=b.dataset.tag;selectedTags.has(t)?(selectedTags.delete(t),b.classList.remove('active')):(selectedTags.add(t),b.classList.add('active'));updateTagCount()});syncTagChoices();updateTagCount()}
function syncTagChoices(){document.querySelectorAll('#tagGrid .tagChoice').forEach(b=>b.classList.toggle('active',selectedTags.has(b.dataset.tag)))}function updateTagCount(){const n=selectedTags.size;$('tagCount').textContent=`${n}個選択中 ＞`;$('selectedSummary').textContent=n===0?'タグ未選択':`${n}個選択中（AND検索）`}function openTagModal(){syncTagChoices();updateTagCount();$('tagModalBackdrop').classList.add('open');document.body.style.overflow='hidden'}function closeTagModal(){$('tagModalBackdrop').classList.remove('open');document.body.style.overflow='';render()}function skillMatches(x){const q=norm($('q').value),g=$('genre').value,s=$('status').value,hay=norm(x.検索用||[x.ID,x.スキル名,x.ジャンル,x.効果,x.全タグ,x.異常状態].join(' '));if(q&&!hay.includes(q))return false;if(g&&!(x.ジャンル||'').split(' / ').includes(g))return false;if(s&&!(x.異常状態||'').split(' / ').includes(s))return false;const tags=(x.全タグ||'').split(' / ').filter(Boolean);for(const t of selectedTags)if(!tags.includes(t))return false;return true}
function skillCard(x){const tags=(x.全タグ||'').split(' / ').filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join(''),sts=(x.異常状態||'').split(' / ').filter(Boolean).map(t=>`<span class="tag statusTag">${esc(t)}</span>`).join('');return `<div class="card" id="skill-${esc(x.ID)}"><div class="cardHeader"><div><div class="title">${esc(x.スキル名)}</div><div class="sub">ID ${esc(x.ID)} · ${esc(x.ジャンル)}</div></div><button class="toggle" onclick="toggleCard(this)">詳細</button></div><div class="tags">${tags}${sts}</div><div class="detail"><div class="effect">${esc(x.効果)}</div>${x.URL?`<a class="linkBtn" href="${esc(x.URL)}" target="_blank">ゲーム内カード検索を開く</a>`:''}</div></div>`}
function statusCard(x){const rel=(x.関連スキル||[]).map((s,i)=>`<button onclick="jumpToSkill('${esc((x.関連スキルID||[])[i]||'')}','${esc(s)}')">${esc(s)}</button>`).join('');return `<div class="card"><div class="title">${esc(x.異常状態名)}</div><div class="sub">ID ${esc(x.異常状態ID)} · 関連スキル ${x.関連スキル数||0}件</div><div class="effect" style="margin-top:10px">${esc(x.説明)}</div><div class="detail" style="display:block"><b>関連スキル</b><div class="related">${rel||'<span class="small">未検出</span>'}</div></div></div>`}
function render(){const out=$('results'),q=norm($('q').value);if(mode==='skills'){const rows=data.skills.filter(skillMatches);$('meta').textContent=`${rows.length}件 / 全${data.skills.length}件`;out.innerHTML=rows.slice(0,1000).map(skillCard).join('')||'<div class="card">該当なし</div>'}else{const rows=data.statuses.filter(x=>!q||norm([x.異常状態名,x.説明,(x.関連スキル||[]).join(' ')].join(' ')).includes(q));$('meta').textContent=`${rows.length}件 / 全${data.statuses.length}件`;out.innerHTML=rows.map(statusCard).join('')||'<div class="card">該当なし</div>'}}
function toggleCard(btn){const c=btn.closest('.card');c.classList.toggle('open');btn.textContent=c.classList.contains('open')?'閉じる':'詳細'}
function jumpToSkill(id,name){mode='skills';$('tabSkills').classList.add('active');$('tabStatuses').classList.remove('active');$('skillFilters').classList.remove('hidden');$('q').value=name||id;$('genre').value='';$('status').value='';selectedTags.clear();syncTagChoices();updateTagCount();render();setTimeout(()=>{const el=id?document.getElementById('skill-'+id):null;if(el){el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'center'});const b=el.querySelector('.toggle');if(b)b.textContent='閉じる'}},50)}
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o.skills||!o.statuses)throw Error('形式不一致');data=o;saveLocal(o);buildFilters();render()}catch(err){$('meta').textContent='読み込み失敗: '+err.message}});['q','genre','status'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));$('openTagModal').onclick=openTagModal;$('closeTagModal').onclick=closeTagModal;$('doneTags').onclick=closeTagModal;$('clearTags').onclick=()=>{selectedTags.clear();syncTagChoices();updateTagCount()};$('tagModalBackdrop').addEventListener('click',e=>{if(e.target===$('tagModalBackdrop'))closeTagModal()});$('tabSkills').onclick=()=>{mode='skills';$('tabSkills').classList.add('active');$('tabStatuses').classList.remove('active');$('skillFilters').classList.remove('hidden');render()};$('tabStatuses').onclick=()=>{mode='statuses';$('tabStatuses').classList.add('active');$('tabSkills').classList.remove('active');$('skillFilters').classList.add('hidden');render()};$('backTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});const saved=loadLocal();if(saved){data=saved;buildFilters();render()}
</script></body></html>
