<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>JOLLY 育成管理</title>

<style>
:root{
  --bg:#f4f5f7;
  --card:#fff;
  --text:#172033;
  --sub:#6b7280;
  --line:#e5e7eb;
  --accent:#2563eb;
  --good:#15803d;
  --warn:#b45309;
  --danger:#b91c1c;
  --purple:#7e22ce;
  --softblue:#eff6ff;
  --softgreen:#f0fdf4;
  --softorange:#fff7ed;
  --softpurple:#faf5ff;
}

*{
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  max-width:760px;
  margin:0 auto;
  padding:
    calc(14px + env(safe-area-inset-top))
    12px
    calc(90px + env(safe-area-inset-bottom));
}

h1{
  font-size:24px;
  margin:4px 0 4px;
}

.subtitle{
  color:var(--sub);
  font-size:12px;
  margin-bottom:14px;
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}

.panelTitle{
  font-size:14px;
  font-weight:800;
  margin-bottom:10px;
}

.summaryGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.summaryCell{
  background:#f9fafb;
  border-radius:12px;
  padding:10px 6px;
  text-align:center;
}

.summaryCell .num{
  font-size:20px;
  font-weight:900;
}

.summaryCell .label{
  margin-top:2px;
  color:var(--sub);
  font-size:10px;
}

.materialGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.materialBox{
  border:1px solid var(--line);
  border-radius:11px;
  padding:8px 9px;
}

.materialName{
  color:var(--sub);
  font-size:11px;
}

.materialCount{
  font-size:18px;
  font-weight:900;
  margin-top:2px;
}

.note{
  margin-top:10px;
  color:var(--sub);
  font-size:11px;
  line-height:1.5;
}

.search{
  display:block;
  width:100%;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:11px 12px;
  background:#fff;
  outline:none;
}

.search:focus{
  border-color:var(--accent);
}

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:2px 0 8px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:0 0 auto;
  border:1px solid #d1d5db;
  background:#fff;
  border-radius:999px;
  padding:8px 12px;
  font-weight:700;
  font-size:13px;
  color:#374151;
}

.tab.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}

select{
  min-width:0;
  width:100%;
  border:1px solid #d1d5db;
  background:#fff;
  border-radius:11px;
  padding:9px 8px;
}

.resultMeta{
  color:var(--sub);
  font-size:12px;
  padding:1px 3px 8px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  margin-bottom:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}

.cardMain{
  display:grid;
  grid-template-columns:84px 1fr;
  gap:11px;
  padding:11px;
}

.cardImage{
  width:84px;
  height:112px;
  object-fit:cover;
  border-radius:10px;
  background:#e5e7eb;
}

.cardName{
  font-size:16px;
  line-height:1.3;
  font-weight:900;
}

.cardSub{
  font-size:11px;
  color:var(--sub);
  margin-top:3px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:6px;
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:3px 7px;
  font-size:10px;
  font-weight:800;
  background:#f3f4f6;
}

.badge.training{
  color:var(--good);
  background:var(--softgreen);
}

.badge.reincarnated{
  color:var(--purple);
  background:var(--softpurple);
}

.badge.stock{
  color:var(--warn);
  background:var(--softorange);
}

.badge.protected{
  color:#1d4ed8;
  background:var(--softblue);
}

.progressArea{
  margin-top:10px;
}

.progressText{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
  font-weight:700;
  margin-bottom:5px;
}

.progressTrack{
  height:8px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
}

.progressFill{
  height:100%;
  background:var(--accent);
  border-radius:999px;
}

.quickGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-top:9px;
}

.quick{
  text-align:center;
  background:#f9fafb;
  padding:6px 3px;
  border-radius:9px;
}

.quick .qLabel{
  color:var(--sub);
  font-size:9px;
}

.quick .qValue{
  font-size:15px;
  font-weight:900;
  margin-top:1px;
}

.detailButton{
  width:100%;
  border:0;
  border-top:1px solid var(--line);
  background:#fff;
  padding:9px;
  font-weight:800;
  color:#374151;
}

.detail{
  display:none;
  border-top:1px solid var(--line);
  padding:11px;
}

.card.open .detail{
  display:block;
}

.section{
  margin-bottom:14px;
}

.section:last-child{
  margin-bottom:0;
}

.sectionTitle{
  font-size:12px;
  font-weight:900;
  margin-bottom:7px;
}

.materialRows{
  border:1px solid var(--line);
  border-radius:11px;
  overflow:hidden;
}

.matRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 9px;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

.matRow:last-child{
  border-bottom:0;
}

.matRow.total{
  font-weight:900;
  background:#f9fafb;
}

.matZero{
  color:#9ca3af;
}

.reincarnationBox{
  background:var(--softpurple);
  border:1px solid #e9d5ff;
  border-radius:11px;
  padding:9px;
  font-size:12px;
  line-height:1.55;
}

.instance{
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px;
  margin-bottom:6px;
  font-size:11px;
}

.instance:last-child{
  margin-bottom:0;
}

.instanceTop{
  display:flex;
  justify-content:space-between;
  gap:6px;
  align-items:center;
}

.instanceAwake{
  font-weight:900;
}

.empty{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:24px 12px;
  text-align:center;
  color:var(--sub);
}

.loadError{
  background:#fff1f2;
  color:#9f1239;
  border:1px solid #fecdd3;
  border-radius:12px;
  padding:10px;
  font-size:12px;
  line-height:1.5;
}

.fileRow{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.fileButton{
  display:inline-block;
  border:1px solid #d1d5db;
  background:#fff;
  padding:8px 10px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
}

#fileInput{
  display:none;
}

.clearButton{
  border:0;
  background:#f3f4f6;
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  font-weight:700;
}

.backTop{
  position:fixed;
  right:15px;
  bottom:calc(18px + env(safe-area-inset-bottom));
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#111827;
  color:#fff;
  font-size:18px;
  font-weight:900;
  box-shadow:0 4px 15px rgba(0,0,0,.18);
}

@media(max-width:390px){
  .cardMain{
    grid-template-columns:74px 1fr;
  }

  .cardImage{
    width:74px;
    height:99px;
  }

  .quick .qValue{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="app">

  <h1>JOLLY 育成管理</h1>

  <div class="subtitle" id="subtitle">
    user_inventory.json を読み込みます
  </div>

  <div id="summary"></div>

  <div class="panel">
    <input
      id="search"
      class="search"
      type="search"
      placeholder="カード名・No.で検索"
      autocomplete="off"
    >

    <div class="tabs" style="margin-top:10px">
      <button class="tab active" data-mode="all">すべて</button>
      <button class="tab" data-mode="training">育成中</button>
      <button class="tab" data-mode="untrained">未育成</button>
      <button class="tab" data-mode="reincarnated">転生後</button>
      <button class="tab" data-mode="materials">同名素材あり</button>
    </div>

    <div class="filters">
      <select id="property">
        <option value="">全属性</option>
        <option value="戦">戦</option>
        <option value="獣">獣</option>
        <option value="魔">魔</option>
        <option value="飛">飛</option>
        <option value="船">船</option>
      </select>

      <select id="rarity">
        <option value="">全レア度</option>
        <option value="7">★7 Legend</option>
        <option value="6">★6 Ultra Rare</option>
        <option value="5">★5 Super Rare</option>
        <option value="4">★4 High Rare</option>
        <option value="3">★3</option>
        <option value="2">★2</option>
        <option value="1">★1 Normal</option>
      </select>

      <select id="sort">
        <option value="priority">おすすめ順</option>
        <option value="remainingAsc">残り覚醒 少ない順</option>
        <option value="remainingDesc">残り覚醒 多い順</option>
        <option value="awakeningDesc">覚醒回数 多い順</option>
        <option value="materialsDesc">同名素材 多い順</option>
        <option value="ownedDesc">所有枚数 多い順</option>
        <option value="cardNo">カードNo.順</option>
      </select>

      <button class="clearButton" id="clear">
        条件解除
      </button>
    </div>

    <div class="fileRow">
      <label class="fileButton" for="fileInput">
        JSONを手動選択
      </label>

      <input
        id="fileInput"
        type="file"
        accept=".json,application/json"
      >

      <span
        id="loadStatus"
        style="font-size:11px;color:#6b7280"
      ></span>
    </div>
  </div>

  <div class="resultMeta" id="resultMeta"></div>

  <div id="results"></div>

</div>

<button class="backTop" id="backTop">↑</button>

<script>
const DATA_URL = './user_inventory.json';
const CACHE_KEY = 'jolly-training-inventory-v1';

let db = null;
let mode = 'all';

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    })[c]
  );
}

function num(value, fallback=0){
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function norm(value){
  return String(value ?? '')
    .toLowerCase()
    .normalize('NFKC');
}

function remainingOf(card){
  if(card.remaining_awakenings_site != null){
    return num(card.remaining_awakenings_site);
  }

  return num(card.remaining_awakenings);
}

function maxAwakening(card){
  if(card.awakening_max_site != null){
    return num(card.awakening_max_site);
  }

  return num(card.awakening_max);
}

function awakeningOf(card){
  return num(card.awakening_count);
}

function progressPercent(card){
  const max = maxAwakening(card);
  if(!max) return 0;

  return Math.max(
    0,
    Math.min(
      100,
      awakeningOf(card) / max * 100
    )
  );
}

function propertyOrder(p){
  return ({
    '戦':0,
    '獣':1,
    '魔':2,
    '飛':3,
    '船':4
  })[p] ?? 99;
}

function isDisplayCard(card){
  /*
    特殊素材として明示除外されたものは
    通常の育成カード一覧から除外する。
  */
  return !card.same_card_material_special_excluded;
}

function siteMaterialMap(){
  const rows = db?.materials?.site_display || [];
  const out = {};

  for(const row of rows){
    out[row.material_name] =
      num(row.owned_count_site);
  }

  return out;
}

function renderSummary(){
  if(!db){
    $('summary').innerHTML = '';
    return;
  }

  const cards =
    (db.cards || []).filter(isDisplayCard);

  const training =
    cards.filter(c => c.training).length;

  const reincarnated =
    cards.filter(c => c.is_reincarnated).length;

  const sameMaterials =
    cards.filter(
      c => num(c.same_card_material_copies) > 0
    ).length;

  const materialRows =
    db.materials?.site_display || [];

  const mats = materialRows.map(row => `
    <div class="materialBox">
      <div class="materialName">
        ${esc(row.material_name)}
      </div>
      <div class="materialCount">
        ${num(row.owned_count_site)}
      </div>
    </div>
  `).join('');

  const physicalSummary =
    db.materials?.physical_summary || [];

  const unconfirmedNewYear =
    physicalSummary.find(
      x => x.material_class ===
           'unconfirmed_newyear_tokupan'
    );

  $('summary').innerHTML = `
    <div class="panel">
      <div class="panelTitle">
        所有・育成状況
      </div>

      <div class="summaryGrid">
        <div class="summaryCell">
          <div class="num">
            ${db.meta?.owned_card_type_count ?? cards.length}
          </div>
          <div class="label">
            所有カード種類
          </div>
        </div>

        <div class="summaryCell">
          <div class="num">
            ${training}
          </div>
          <div class="label">
            育成中
          </div>
        </div>

        <div class="summaryCell">
          <div class="num">
            ${reincarnated}
          </div>
          <div class="label">
            所有転生後
          </div>
        </div>

        <div class="summaryCell">
          <div class="num">
            ${db.meta?.owned_instance_count ?? '-'}
          </div>
          <div class="label">
            総所有枚数
          </div>
        </div>

        <div class="summaryCell">
          <div class="num">
            ${sameMaterials}
          </div>
          <div class="label">
            同名素材あり
          </div>
        </div>

        <div class="summaryCell">
          <div class="num">
            ${db.meta?.reincarnation_relation_count ?? '-'}
          </div>
          <div class="label">
            転生関係
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panelTitle">
        覚醒素材
      </div>

      <div class="materialGrid">
        ${mats || '<div class="note">素材情報なし</div>'}
      </div>

      <div class="note">
        とくぱん・転生らいおん等は全カードで共有する素材です。
        各カードに表示する「投入可能」は、
        そのカードへすべて投入した場合の上限であり、
        複数カードへ同時に配分できる数ではありません。
        ${
          unconfirmedNewYear
          ? `<br>※ 未確認分類のお正月とくぱん：
             ${num(unconfirmedNewYear.physical_owned)}枚
             （現在の覚醒可能数には加算していません）`
          : ''
        }
      </div>
    </div>
  `;
}

function cardMatchesMode(card){
  if(mode === 'training'){
    return !!card.training;
  }

  if(mode === 'untrained'){
    return !card.training;
  }

  if(mode === 'reincarnated'){
    return !!card.is_reincarnated;
  }

  if(mode === 'materials'){
    return num(card.same_card_material_copies) > 0;
  }

  return true;
}

function priorityScore(card){
  /*
    初期表示：
      育成中
      →残りが少ない
      →同名素材あり
      →転生後
      の順を優先
  */
  let score = 0;

  if(card.training) score += 100000;

  score +=
    Math.max(0, 100 - remainingOf(card)) * 100;

  score +=
    Math.min(
      num(card.same_card_material_copies),
      50
    ) * 10;

  if(card.is_reincarnated) score += 100;

  return score;
}

function filteredCards(){
  if(!db) return [];

  const q = norm($('search').value);
  const prop = $('property').value;
  const rarity = $('rarity').value;
  const sort = $('sort').value;

  let rows =
    (db.cards || [])
      .filter(isDisplayCard)
      .filter(cardMatchesMode)
      .filter(c => {
        if(
          q &&
          !norm(
            `${c.card_name} ${c.card_no}`
          ).includes(q)
        ){
          return false;
        }

        if(
          prop &&
          c.property !== prop
        ){
          return false;
        }

        if(
          rarity &&
          String(c.rarity_stars) !== rarity
        ){
          return false;
        }

        return true;
      });

  rows.sort((a,b) => {

    if(sort === 'remainingAsc'){
      return (
        remainingOf(a) -
        remainingOf(b)
      );
    }

    if(sort === 'remainingDesc'){
      return (
        remainingOf(b) -
        remainingOf(a)
      );
    }

    if(sort === 'awakeningDesc'){
      return (
        awakeningOf(b) -
        awakeningOf(a)
      );
    }

    if(sort === 'materialsDesc'){
      return (
        num(b.same_card_material_copies) -
        num(a.same_card_material_copies)
      );
    }

    if(sort === 'ownedDesc'){
      return (
        num(b.owned_count) -
        num(a.owned_count)
      );
    }

    if(sort === 'cardNo'){
      return (
        num(a.card_no) -
        num(b.card_no)
      );
    }

    const ps =
      priorityScore(b) -
      priorityScore(a);

    if(ps !== 0) return ps;

    const po =
      propertyOrder(a.property) -
      propertyOrder(b.property);

    if(po !== 0) return po;

    return (
      num(a.card_no) -
      num(b.card_no)
    );
  });

  return rows;
}

function materialRow(
  label,
  value,
  emphasize=false
){
  const n = num(value);

  return `
    <div class="matRow ${emphasize ? 'total' : ''}">
      <span>${esc(label)}</span>
      <strong class="${n === 0 ? 'matZero' : ''}">
        ${n}
      </strong>
    </div>
  `;
}

function renderInstances(card){
  const rows =
    (card.training_instances || [])
      .filter(
        x => num(x.awakening_count) > 0
      )
      .sort(
        (a,b) =>
          num(b.awakening_count) -
          num(a.awakening_count)
      );

  if(!rows.length){
    return `
      <div class="note">
        覚醒済み個体なし
      </div>
    `;
  }

  return rows.map((x,index) => `
    <div class="instance">
      <div class="instanceTop">
        <span>
          個体 ${index + 1}
          ${
            x.protected
            ? '<span class="badge protected">保護</span>'
            : ''
          }
        </span>

        <span class="instanceAwake">
          覚醒 ${num(x.awakening_count)}回
        </span>
      </div>

      <div style="margin-top:4px;color:#6b7280">
        Lv.${num(x.level)}
        / ${num(x.level_max)}
        ・残り
        ${num(x.remaining_awakenings_site)}回
      </div>

      <div style="margin-top:3px;color:#9ca3af">
        instance:
        ${esc(x.instance_id)}
      </div>
    </div>
  `).join('');
}

function cardHtml(card){
  const awakening = awakeningOf(card);
  const max = maxAwakening(card);
  const remaining = remainingOf(card);

  const materials =
    card.usable_materials_if_all_spent_here || {};

  const same =
    num(materials.same_card);

  const pre =
    num(materials.pre_reincarnation_card);

  const universal =
    num(materials.universal_tokupan);

  const rarityTokupan =
    num(materials.same_rarity_tokupan);

  const lion =
    num(materials.reincarnation_lion);

  const kingLion =
    num(materials.king_reincarnation_lion);

  const total =
    num(materials.total);

  const possible =
    num(
      card.resource_possible_awakenings_if_all_spent_here
    );

  const pct = progressPercent(card);

  const badges = [];

  if(card.training){
    badges.push(
      '<span class="badge training">育成中</span>'
    );
  }

  if(card.is_reincarnated){
    badges.push(
      '<span class="badge reincarnated">転生後</span>'
    );
  }

  if(num(card.stock_owned) > 0){
    badges.push(
      `<span class="badge stock">
        ストック ${num(card.stock_owned)}
       </span>`
    );
  }

  if(num(card.training_instance_count) > 1){
    badges.push(
      `<span class="badge">
        育成個体 ${num(card.training_instance_count)}
       </span>`
    );
  }

  const reincarnation = card.is_reincarnated
    ? `
      <div class="section">
        <div class="sectionTitle">
          転生情報
        </div>

        <div class="reincarnationBox">
          転生前：
          <strong>
            ${esc(card.reincarnation_source_card_name || '?')}
          </strong>
          （No.${esc(card.reincarnation_source_card_no || '?')}）
          <br>

          転生前カード保有：
          <strong>
            ${num(card.pre_reincarnation_material_copies)}枚
          </strong>

          <br>
          この転生前カードは転生後カードの覚醒素材として使用可能。
        </div>
      </div>
    `
    : '';

  return `
    <div class="card">

      <div class="cardMain">

        <img
          class="cardImage"
          src="${esc(card.image_url)}"
          loading="lazy"
          alt="${esc(card.card_name)}"
          onerror="this.style.visibility='hidden'"
        >

        <div>

          <div class="cardName">
            ${esc(card.card_name)}
          </div>

          <div class="cardSub">
            No.${esc(card.card_no)}
            ・${esc(card.property)}
            ・${esc(card.rarity_name)}
            ・★${esc(card.rarity_stars)}
          </div>

          <div class="badges">
            ${badges.join('')}
          </div>

          <div class="progressArea">

            <div class="progressText">
              <span>
                覚醒 ${awakening}/${max}
              </span>
              <span>
                残り ${remaining}
              </span>
            </div>

            <div class="progressTrack">
              <div
                class="progressFill"
                style="width:${pct}%"
              ></div>
            </div>

          </div>

          <div class="quickGrid">

            <div class="quick">
              <div class="qLabel">
                所有
              </div>
              <div class="qValue">
                ${num(card.owned_count)}
              </div>
            </div>

            <div class="quick">
              <div class="qLabel">
                同名素材
              </div>
              <div class="qValue">
                ${num(card.same_card_material_copies)}
              </div>
            </div>

            <div class="quick">
              <div class="qLabel">
                投入可能
              </div>
              <div class="qValue">
                ${possible}
              </div>
            </div>

          </div>

        </div>
      </div>

      <button
        class="detailButton"
        onclick="toggleCard(this)"
      >
        詳細
      </button>

      <div class="detail">

        <div class="section">

          <div class="sectionTitle">
            所有内訳
          </div>

          <div class="materialRows">

            ${materialRow(
              'カード一覧',
              card.card_list_owned
            )}

            ${materialRow(
              'ストック',
              card.stock_owned
            )}

            ${materialRow(
              '覚醒済み個体',
              card.awakened_instance_count
            )}

            ${materialRow(
              '未覚醒個体',
              card.unawakened_instance_count
            )}

            ${materialRow(
              '同名覚醒素材として使用可能',
              card.same_card_material_copies,
              true
            )}

          </div>

        </div>

        ${reincarnation}

        <div class="section">

          <div class="sectionTitle">
            このカードに使える覚醒素材
          </div>

          <div class="materialRows">

            ${materialRow(
              '同名カード',
              same
            )}

            ${
              card.is_reincarnated
              ? materialRow(
                  `転生前カード ${
                    card.reincarnation_source_card_name
                    ? '（' +
                      esc(card.reincarnation_source_card_name) +
                      '）'
                    : ''
                  }`,
                  pre
                )
              : ''
            }

            ${materialRow(
              'とくぱん（全レア対応）',
              universal
            )}

            ${materialRow(
              '同レア度とくぱん',
              rarityTokupan
            )}

            ${
              card.is_reincarnated
              ? materialRow(
                  '転生らいおん',
                  lion
                )
              : ''
            }

            ${
              card.is_reincarnated
              ? materialRow(
                  'キング転生らいおん',
                  kingLion
                )
              : ''
            }

            ${materialRow(
              '使用可能素材 合計',
              total,
              true
            )}

            ${materialRow(
              '現在の残り覚醒回数',
              remaining
            )}

            ${materialRow(
              '全素材投入時に進められる回数',
              possible,
              true
            )}

          </div>

          <div class="note">
            「全素材投入時」は共有素材を
            このカード1枚に優先投入した場合の計算です。
          </div>

        </div>

        <div class="section">

          <div class="sectionTitle">
            覚醒済み個体
          </div>

          ${renderInstances(card)}

        </div>

      </div>

    </div>
  `;
}

function render(){
  if(!db){
    $('results').innerHTML = `
      <div class="empty">
        user_inventory.json を読み込んでください
      </div>
    `;
    return;
  }

  const rows = filteredCards();

  $('resultMeta').textContent =
    `${rows.length}種類を表示`;

  if(!rows.length){
    $('results').innerHTML = `
      <div class="empty">
        条件に一致するカードはありません
      </div>
    `;
    return;
  }

  $('results').innerHTML =
    rows.map(cardHtml).join('');
}

function toggleCard(button){
  const card =
    button.closest('.card');

  card.classList.toggle('open');

  button.textContent =
    card.classList.contains('open')
      ? '閉じる'
      : '詳細';
}

function validateDb(obj){
  if(!obj || typeof obj !== 'object'){
    throw new Error(
      'JSONオブジェクトではありません'
    );
  }

  if(
    obj.meta?.type !==
    'jolly_user_inventory'
  ){
    throw new Error(
      'jolly_user_inventory ではありません'
    );
  }

  if(!Array.isArray(obj.cards)){
    throw new Error(
      'cards配列がありません'
    );
  }

  return obj;
}

function applyDb(obj, source){
  db = validateDb(obj);

  localStorage.setItem(
    CACHE_KEY,
    JSON.stringify(db)
  );

  $('subtitle').textContent =
    `所有 ${db.meta?.owned_instance_count ?? '-'}枚`
    + ` / ${db.meta?.owned_card_type_count ?? db.cards.length}種類`
    + ` / inventory v${db.meta?.version ?? '?'}`;

  $('loadStatus').textContent =
    source;

  renderSummary();
  render();
}

async function loadAutomatic(){
  $('loadStatus').textContent =
    '自動読込中…';

  try{
    const response = await fetch(
      DATA_URL + '?t=' + Date.now(),
      {
        cache:'no-store'
      }
    );

    if(!response.ok){
      throw new Error(
        'HTTP ' + response.status
      );
    }

    const obj =
      await response.json();

    applyDb(
      obj,
      'user_inventory.json'
    );

    return;

  }catch(error){
    console.warn(
      'automatic load failed',
      error
    );
  }

  try{
    const cached =
      localStorage.getItem(
        CACHE_KEY
      );

    if(cached){
      applyDb(
        JSON.parse(cached),
        '端末保存データ'
      );

      return;
    }
  }catch(error){
    console.warn(
      'local cache failed',
      error
    );
  }

  $('loadStatus').textContent =
    '手動選択してください';

  $('results').innerHTML = `
    <div class="loadError">
      user_inventory.json を自動読込できませんでした。
      「JSONを手動選択」から最新ファイルを選択してください。
      一度読み込めば端末にも保存されます。
    </div>
  `;
}

document
  .querySelectorAll('.tab')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        document
          .querySelectorAll('.tab')
          .forEach(
            b => b.classList.remove(
              'active'
            )
          );

        button.classList.add(
          'active'
        );

        mode =
          button.dataset.mode;

        render();
      }
    );

  });

$('search').addEventListener(
  'input',
  render
);

$('property').addEventListener(
  'change',
  render
);

$('rarity').addEventListener(
  'change',
  render
);

$('sort').addEventListener(
  'change',
  render
);

$('clear').addEventListener(
  'click',
  () => {

    $('search').value = '';
    $('property').value = '';
    $('rarity').value = '';
    $('sort').value = 'priority';

    mode = 'all';

    document
      .querySelectorAll('.tab')
      .forEach(
        b => b.classList.remove(
          'active'
        )
      );

    document
      .querySelector(
        '.tab[data-mode="all"]'
      )
      .classList.add(
        'active'
      );

    render();
  }
);

$('fileInput').addEventListener(
  'change',
  async event => {

    const file =
      event.target.files?.[0];

    if(!file) return;

    try{
      const text =
        await file.text();

      const obj =
        JSON.parse(text);

      applyDb(
        obj,
        file.name
      );

    }catch(error){

      $('loadStatus').textContent =
        '読込失敗';

      alert(
        'JSONを読み込めませんでした。\n'
        + error.message
      );
    }

  }
);

$('backTop').addEventListener(
  'click',
  () => {
    scrollTo({
      top:0,
      behavior:'smooth'
    });
  }
);

loadAutomatic();
</script>

</body>
</html>
