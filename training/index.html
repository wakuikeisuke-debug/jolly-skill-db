<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>JOLLY 育成管理</title>

<style>
:root{
  --bg:#f3f8f8;
  --card:#fff;
  --text:#172033;
  --sub:#6b7280;
  --line:#e5e7eb;
  --accent:#2563eb;
  --good:#16a34a;
  --warn:#b45309;
  --purple:#7e22ce;
  --softblue:#eff6ff;
  --softgreen:#f0fdf4;
  --softorange:#fff7ed;
  --softpurple:#faf5ff;
  --softyellow:#fffbeb;
}

*{
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  max-width:760px;
  margin:0 auto;
  padding:
    calc(14px + env(safe-area-inset-top))
    12px
    calc(150px + env(safe-area-inset-bottom));
}

h1{
  font-size:24px;
  margin:4px 0 8px;
}

.subtitle{
  color:var(--sub);
  font-size:12px;
  margin-bottom:14px;
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  margin-bottom:12px;
}

.panelTitle{
  font-size:14px;
  font-weight:800;
  margin-bottom:10px;
}

.summaryGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.summaryCell{
  background:#f9fafb;
  border-radius:12px;
  padding:10px 6px;
  text-align:center;
}

.summaryCell .num{
  font-size:20px;
  font-weight:900;
}

.summaryCell .label{
  margin-top:2px;
  color:var(--sub);
  font-size:10px;
}

.materialGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.materialBox{
  border:1px solid var(--line);
  border-radius:11px;
  padding:8px 9px;
}

.materialName{
  color:var(--sub);
  font-size:11px;
}

.materialCount{
  font-size:18px;
  font-weight:900;
  margin-top:2px;
}

.note{
  margin-top:10px;
  color:var(--sub);
  font-size:11px;
  line-height:1.55;
}

.search{
  display:block;
  width:100%;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:11px 12px;
  background:#fff;
  outline:none;
}

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:2px 0 8px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:0 0 auto;
  border:1px solid #d1d5db;
  background:#fff;
  border-radius:999px;
  padding:8px 12px;
  font-weight:700;
  font-size:13px;
  color:#374151;
}

.tab.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}

select{
  width:100%;
  border:1px solid #d1d5db;
  background:#fff;
  border-radius:11px;
  padding:9px 8px;
}

.resultMeta{
  color:var(--sub);
  font-size:12px;
  padding:1px 3px 8px;
  line-height:1.5;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.cardMain{
  display:grid;
  grid-template-columns:84px 1fr;
  gap:11px;
  padding:11px;
}

.cardImage{
  width:84px;
  height:112px;
  object-fit:cover;
  border-radius:10px;
  background:#e5e7eb;
}

.cardName{
  font-size:16px;
  line-height:1.3;
  font-weight:900;
}

.cardSub{
  font-size:11px;
  color:var(--sub);
  margin-top:3px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:6px;
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:3px 7px;
  font-size:10px;
  font-weight:800;
  background:#f3f4f6;
}

.badge.training{
  color:var(--good);
  background:var(--softgreen);
}

.badge.reincarnated{
  color:var(--purple);
  background:var(--softpurple);
}

.badge.stock{
  color:var(--warn);
  background:var(--softorange);
}

.badge.pre{
  color:#92400e;
  background:var(--softyellow);
}

.progressArea{
  margin-top:10px;
}

.progressText{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
  font-weight:800;
  margin-bottom:5px;
}

.progressTrack{
  height:8px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
}

.progressFill{
  height:100%;
  background:var(--accent);
  border-radius:999px;
}

.quickGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-top:9px;
}

.quick{
  text-align:center;
  background:#f9fafb;
  padding:6px 3px;
  border-radius:9px;
}

.quick.materialStrong{
  background:#f0fdf4;
  border:1px solid #dcfce7;
}

.quick .qLabel{
  color:var(--sub);
  font-size:9px;
}

.quick .qValue{
  font-size:15px;
  font-weight:900;
  margin-top:1px;
}

.detailButton{
  width:100%;
  border:0;
  border-top:1px solid var(--line);
  background:#fff;
  padding:10px;
  font-weight:900;
  color:#374151;
}

.detail{
  display:none;
  border-top:1px solid var(--line);
  padding:11px 11px 24px;
}

.card.open .detail{
  display:block;
}

.section{
  margin-bottom:14px;
}

.section:last-child{
  margin-bottom:0;
}

.sectionTitle{
  font-size:12px;
  font-weight:900;
  margin-bottom:7px;
}

.materialRows{
  border:1px solid var(--line);
  border-radius:11px;
  overflow:hidden;
}

.matRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 10px;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

.matRow:last-child{
  border-bottom:0;
}

.matRow.total{
  font-weight:900;
  background:#f9fafb;
}

.matRow.important{
  font-weight:900;
  background:var(--softgreen);
}

.matZero{
  color:#9ca3af;
}

.reincarnationBox{
  background:var(--softpurple);
  border:1px solid #e9d5ff;
  border-radius:11px;
  padding:9px;
  font-size:12px;
  line-height:1.55;
}

.instance{
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px;
  margin-bottom:6px;
  font-size:11px;
}

.instance:last-child{
  margin-bottom:0;
}

.instanceTop{
  display:flex;
  justify-content:space-between;
  gap:6px;
}

.instanceAwake{
  font-weight:900;
}

.fileRow{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.fileButton{
  display:inline-block;
  border:1px solid #d1d5db;
  background:#fff;
  padding:8px 10px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
}

#fileInput{
  display:none;
}

.clearButton{
  border:0;
  background:#f3f4f6;
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  font-weight:700;
}

.empty{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:24px 12px;
  text-align:center;
  color:var(--sub);
}

.backTop{
  position:fixed;
  right:15px;
  bottom:calc(78px + env(safe-area-inset-bottom));
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:#111827;
  color:#fff;
  font-size:20px;
  font-weight:900;
  box-shadow:0 4px 15px rgba(0,0,0,.18);
  transition:
    opacity .15s ease,
    transform .15s ease;
}

.backTop.hidden{
  opacity:0;
  pointer-events:none;
  transform:scale(.8);
}

@media(max-width:390px){
  .cardMain{
    grid-template-columns:74px 1fr;
  }

  .cardImage{
    width:74px;
    height:99px;
  }

  .quick .qValue{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="app">

  <h1>JOLLY 育成管理</h1>

  <div class="subtitle" id="subtitle">
    user_inventory.json を読み込みます
  </div>

  <div id="summary"></div>

  <div class="panel">
    <input
      id="search"
      class="search"
      type="search"
      placeholder="カード名・No.で検索"
      autocomplete="off"
    >

    <div class="tabs" style="margin-top:10px">
      <button class="tab active" data-mode="all">すべて</button>
      <button class="tab" data-mode="training">育成中</button>
      <button class="tab" data-mode="untrained">未育成</button>
      <button class="tab" data-mode="reincarnated">転生後</button>
      <button class="tab" data-mode="materials">育成素材あり</button>
    </div>

    <div class="filters">
      <select id="property">
        <option value="">全属性</option>
        <option value="戦">戦</option>
        <option value="獣">獣</option>
        <option value="魔">魔</option>
        <option value="飛">飛</option>
        <option value="船">船</option>
      </select>

      <select id="rarity">
        <option value="">全レア度</option>
        <option value="7">★7 Legend</option>
        <option value="6">★6 Ultra Rare</option>
        <option value="5">★5 Super Rare</option>
        <option value="4">★4 High Rare</option>
        <option value="3">★3</option>
        <option value="2">★2</option>
        <option value="1">★1 Normal</option>
      </select>

      <select id="sort">
        <option value="priority">おすすめ順</option>
        <option value="remainingAsc">残り覚醒 少ない順</option>
        <option value="remainingDesc">残り覚醒 多い順</option>
        <option value="awakeningDesc">覚醒回数 多い順</option>
        <option value="materialsDesc">同名素材 多い順</option>
        <option value="ownedDesc">所有枚数 多い順</option>
        <option value="cardNo">カードNo.順</option>
      </select>

      <button class="clearButton" id="clear">
        条件解除
      </button>
    </div>

    <div class="fileRow">
      <label class="fileButton" for="fileInput">
        JSONを手動選択
      </label>

      <input
        id="fileInput"
        type="file"
        accept=".json,application/json"
      >

      <span id="loadStatus"
            style="font-size:11px;color:#6b7280"></span>
    </div>
  </div>

  <div class="resultMeta" id="resultMeta"></div>
  <div id="results"></div>

</div>

<button class="backTop" id="backTop">↑</button>

<script>
const DATA_URL = './user_inventory.json';
const CACHE_KEY = 'jolly-training-inventory-v2';

let db = null;
let mode = 'all';

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    })[c]
  );
}

function num(v,f=0){
  const n = Number(v);
  return Number.isFinite(n) ? n : f;
}

function norm(v){
  return String(v ?? '')
    .toLowerCase()
    .normalize('NFKC');
}

function remainingOf(card){
  if(card.remaining_awakenings_site != null){
    return num(card.remaining_awakenings_site);
  }
  return num(card.remaining_awakenings);
}

function maxAwakening(card){
  if(card.awakening_max_site != null){
    return num(card.awakening_max_site);
  }
  return num(card.awakening_max);
}

function awakeningOf(card){
  return num(card.awakening_count);
}

function progressPercent(card){
  const max = maxAwakening(card);
  if(!max) return 0;

  return Math.max(
    0,
    Math.min(
      100,
      awakeningOf(card) / max * 100
    )
  );
}

function isDisplayCard(card){
  return !card.same_card_material_special_excluded;
}

function hasTrainingMaterial(card){
  return (
    num(card.same_card_material_copies) > 0
    ||
    num(card.pre_reincarnation_material_copies) > 0
  );
}

function renderSummary(){
  if(!db){
    $('summary').innerHTML = '';
    return;
  }

  const cards =
    (db.cards || []).filter(isDisplayCard);

  const training =
    cards.filter(c => c.training).length;

  const reincarnated =
    cards.filter(c => c.is_reincarnated).length;

  const materialCards =
    cards.filter(hasTrainingMaterial).length;

  $('summary').innerHTML = `
    <div class="panel">
      <div class="panelTitle">所有・育成状況</div>

      <div class="summaryGrid">
        <div class="summaryCell">
          <div class="num">
            ${db.meta?.owned_card_type_count ?? cards.length}
          </div>
          <div class="label">所有カード種類</div>
        </div>

        <div class="summaryCell">
          <div class="num">${training}</div>
          <div class="label">育成中</div>
        </div>

        <div class="summaryCell">
          <div class="num">${reincarnated}</div>
          <div class="label">所有転生後</div>
        </div>

        <div class="summaryCell">
          <div class="num">
            ${db.meta?.owned_instance_count ?? '-'}
          </div>
          <div class="label">総所有枚数</div>
        </div>

        <div class="summaryCell">
          <div class="num">${materialCards}</div>
          <div class="label">育成素材あり</div>
        </div>

        <div class="summaryCell">
          <div class="num">
            ${db.meta?.reincarnation_relation_count ?? '-'}
          </div>
          <div class="label">転生関係</div>
        </div>
      </div>
    </div>
  `;
}

function cardMatchesMode(card){
  if(mode === 'training'){
    return !!card.training;
  }

  if(mode === 'untrained'){
    return !card.training;
  }

  if(mode === 'reincarnated'){
    return !!card.is_reincarnated;
  }

  if(mode === 'materials'){
    return hasTrainingMaterial(card);
  }

  return true;
}

function filteredCards(){
  if(!db) return [];

  const q = norm($('search').value);
  const prop = $('property').value;
  const rarity = $('rarity').value;
  const sort = $('sort').value;

  let rows =
    (db.cards || [])
      .filter(isDisplayCard)
      .filter(cardMatchesMode)
      .filter(c => {
        if(
          q &&
          !norm(`${c.card_name} ${c.card_no}`)
            .includes(q)
        ){
          return false;
        }

        if(prop && c.property !== prop){
          return false;
        }

        if(
          rarity &&
          String(c.rarity_stars) !== rarity
        ){
          return false;
        }

        return true;
      });

  rows.sort((a,b) => {

    if(sort === 'remainingAsc'){
      return remainingOf(a) - remainingOf(b);
    }

    if(sort === 'remainingDesc'){
      return remainingOf(b) - remainingOf(a);
    }

    if(sort === 'awakeningDesc'){
      return awakeningOf(b) - awakeningOf(a);
    }

    if(sort === 'materialsDesc'){
      return (
        num(b.same_card_material_copies) -
        num(a.same_card_material_copies)
      );
    }

    if(sort === 'ownedDesc'){
      return num(b.owned_count) - num(a.owned_count);
    }

    if(sort === 'cardNo'){
      return num(a.card_no) - num(b.card_no);
    }

    /*
      おすすめ順：
      育成中を最優先し、
      育成中同士なら残り覚醒が少ない順。
    */
    if(a.training !== b.training){
      return a.training ? -1 : 1;
    }

    if(a.training && b.training){
      const rem =
        remainingOf(a) - remainingOf(b);

      if(rem !== 0) return rem;

      return awakeningOf(b) - awakeningOf(a);
    }

    if(a.is_reincarnated !== b.is_reincarnated){
      return a.is_reincarnated ? -1 : 1;
    }

    const matA =
      num(a.same_card_material_copies)
      +
      num(a.pre_reincarnation_material_copies);

    const matB =
      num(b.same_card_material_copies)
      +
      num(b.pre_reincarnation_material_copies);

    if(matA !== matB){
      return matB - matA;
    }

    return num(a.card_no) - num(b.card_no);
  });

  return rows;
}

function materialRow(
  label,
  value,
  cls=''
){
  const n = num(value);

  return `
    <div class="matRow ${cls}">
      <span>${label}</span>
      <strong class="${n === 0 ? 'matZero' : ''}">
        ${n}
      </strong>
    </div>
  `;
}

function renderInstances(card){
  const rows =
    (card.training_instances || [])
      .filter(x => num(x.awakening_count) > 0)
      .sort(
        (a,b) =>
          num(b.awakening_count) -
          num(a.awakening_count)
      );

  if(!rows.length){
    return `<div class="note">覚醒済み個体なし</div>`;
  }

  return rows.map((x,index) => `
    <div class="instance">
      <div class="instanceTop">
        <span>個体 ${index + 1}</span>

        <span class="instanceAwake">
          覚醒 ${num(x.awakening_count)}回
        </span>
      </div>

      <div style="margin-top:4px;color:#6b7280">
        Lv.${num(x.level)}
        / ${num(x.level_max)}
        ・残り ${num(x.remaining_awakenings_site)}回
      </div>
    </div>
  `).join('');
}

function cardHtml(card){
  const awakening = awakeningOf(card);
  const max = maxAwakening(card);
  const remaining = remainingOf(card);
  const pct = progressPercent(card);

  const mats =
    card.usable_materials_if_all_spent_here || {};

  const same = num(mats.same_card);
  const pre = num(mats.pre_reincarnation_card);
  const universal = num(mats.universal_tokupan);
  const rarityTokupan = num(mats.same_rarity_tokupan);
  const lion = num(mats.reincarnation_lion);
  const kingLion = num(mats.king_reincarnation_lion);
  const total = num(mats.total);

  const possible =
    num(
      card.resource_possible_awakenings_if_all_spent_here
    );

  const badges = [];

  if(card.training){
    badges.push(
      `<span class="badge training">育成中</span>`
    );
  }

  if(card.is_reincarnated){
    badges.push(
      `<span class="badge reincarnated">転生後</span>`
    );
  }

  if(
    card.is_reincarnated &&
    pre > 0
  ){
    badges.push(
      `<span class="badge pre">
        転生前素材 ${pre}
       </span>`
    );
  }

  if(num(card.stock_owned) > 0){
    badges.push(
      `<span class="badge stock">
        ストック ${num(card.stock_owned)}
       </span>`
    );
  }

  const middleLabel =
    card.is_reincarnated && pre > 0
      ? '転生前'
      : '同名素材';

  const middleValue =
    card.is_reincarnated && pre > 0
      ? pre
      : same;

  const reincarnation =
    card.is_reincarnated
      ? `
        <div class="section">
          <div class="sectionTitle">転生情報</div>

          <div class="reincarnationBox">
            転生前：
            <strong>
              ${esc(card.reincarnation_source_card_name || '?')}
            </strong>

            <br>

            転生前素材候補：
            <strong>${pre}枚</strong>

            <div class="note">
              転生前カードは転生後カードの覚醒素材にできます。
              育成中など残しておきたい転生前カードも含むため、
              「使用可能候補」として扱います。
            </div>
          </div>
        </div>
      `
      : '';

  return `
    <div class="card">

      <div class="cardMain">

        <img
          class="cardImage"
          src="${esc(card.image_url)}"
          loading="lazy"
          alt="${esc(card.card_name)}"
        >

        <div>

          <div class="cardName">
            ${esc(card.card_name)}
          </div>

          <div class="cardSub">
            No.${esc(card.card_no)}
            ・${esc(card.property)}
            ・${esc(card.rarity_name)}
            ・★${esc(card.rarity_stars)}
          </div>

          <div class="badges">
            ${badges.join('')}
          </div>

          <div class="progressArea">

            <div class="progressText">
              <span>
                覚醒 ${awakening}/${max}
              </span>

              <span>
                残り ${remaining}
              </span>
            </div>

            <div class="progressTrack">
              <div
                class="progressFill"
                style="width:${pct}%"
              ></div>
            </div>

          </div>

          <div class="quickGrid">

            <div class="quick">
              <div class="qLabel">所有</div>
              <div class="qValue">
                ${num(card.owned_count)}
              </div>
            </div>

            <div class="quick materialStrong">
              <div class="qLabel">
                ${middleLabel}
              </div>
              <div class="qValue">
                ${middleValue}
              </div>
            </div>

            <div class="quick">
              <div class="qLabel">最大進行</div>
              <div class="qValue">
                ${possible}
              </div>
            </div>

          </div>

        </div>
      </div>

      <button
        class="detailButton"
        onclick="toggleCard(this)"
      >
        詳細
      </button>

      <div class="detail">

        <div class="section">
          <div class="sectionTitle">
            所有内訳
          </div>

          <div class="materialRows">

            ${materialRow(
              'カード一覧',
              card.card_list_owned
            )}

            ${materialRow(
              'ストック',
              card.stock_owned
            )}

            ${materialRow(
              '覚醒済み個体',
              card.awakened_instance_count
            )}

            ${materialRow(
              '未覚醒個体',
              card.unawakened_instance_count
            )}

            ${materialRow(
              '同名カード素材',
              same,
              same > 0 ? 'important' : ''
            )}

          </div>
        </div>

        ${reincarnation}

        <div class="section">

          <div class="sectionTitle">
            このカードに使える覚醒素材
          </div>

          <div class="materialRows">

            ${materialRow(
              '同名カード',
              same,
              same > 0 ? 'important' : ''
            )}

            ${
              card.is_reincarnated
                ? materialRow(
                    `転生前カード
                    （${esc(
                      card.reincarnation_source_card_name || '?'
                    )}）`,
                    pre,
                    pre > 0 ? 'important' : ''
                  )
                : ''
            }

            ${materialRow(
              'とくぱん系（全レア対応）',
              universal
            )}

            ${materialRow(
              `同レアとくぱん（★${esc(card.rarity_stars)}）`,
              rarityTokupan
            )}

            ${
              card.is_reincarnated
                ? materialRow(
                    '転生らいおん',
                    lion
                  )
                : ''
            }

            ${
              card.is_reincarnated
                ? materialRow(
                    'キング転生らいおん',
                    kingLion
                  )
                : ''
            }

            ${materialRow(
              '使用可能素材 合計',
              total,
              'total'
            )}

            ${materialRow(
              '現在の残り覚醒',
              remaining
            )}

            ${materialRow(
              'このカードへの最大進行',
              possible,
              'total'
            )}

          </div>

          <div class="note">
            「最大進行」は、このカードへ共有素材も含めて
            優先投入した場合に進められる覚醒回数です。
            とくぱん・転生らいおん等は共通在庫なので、
            他カードへの使用分とは重複します。
          </div>

        </div>

        <div class="section">
          <div class="sectionTitle">
            覚醒済み個体
          </div>

          ${renderInstances(card)}
        </div>

      </div>

    </div>
  `;
}

function render(){
  if(!db){
    $('results').innerHTML =
      `<div class="empty">
        user_inventory.json を読み込んでください
       </div>`;
    return;
  }

  const rows = filteredCards();

  $('resultMeta').innerHTML =
    `${rows.length}種類を表示`
    +
    (
      mode === 'materials'
      ? `<br>同名素材に加え、
         転生前カードを素材にできる転生後カードも対象`
      : ''
    );

  if(!rows.length){
    $('results').innerHTML =
      `<div class="empty">
        条件に一致するカードはありません
       </div>`;
    return;
  }

  $('results').innerHTML =
    rows.map(cardHtml).join('');

  updateBackTop();
}

function toggleCard(button){
  const card =
    button.closest('.card');

  card.classList.toggle('open');

  button.textContent =
    card.classList.contains('open')
      ? '閉じる'
      : '詳細';

  updateBackTop();
}

function updateBackTop(){
  const anyOpen =
    !!document.querySelector('.card.open');

  $('backTop').classList.toggle(
    'hidden',
    anyOpen
  );
}

function validateDb(obj){
  if(
    !obj ||
    obj.meta?.type !== 'jolly_user_inventory' ||
    !Array.isArray(obj.cards)
  ){
    throw new Error(
      'user_inventory.json の形式ではありません'
    );
  }

  return obj;
}

function applyDb(obj, source){
  db = validateDb(obj);

  localStorage.setItem(
    CACHE_KEY,
    JSON.stringify(db)
  );

  $('subtitle').textContent =
    `所有 ${db.meta?.owned_instance_count ?? '-'}枚`
    + ` / ${db.meta?.owned_card_type_count ?? db.cards.length}種類`;

  $('loadStatus').textContent = source;

  renderSummary();
  render();
}

async function loadAutomatic(){
  try{
    const r = await fetch(
      DATA_URL + '?t=' + Date.now(),
      {cache:'no-store'}
    );

    if(!r.ok){
      throw new Error(
        'HTTP ' + r.status
      );
    }

    applyDb(
      await r.json(),
      'user_inventory.json'
    );

    return;

  }catch(e){
    console.warn(e);
  }

  try{
    const cached =
      localStorage.getItem(CACHE_KEY);

    if(cached){
      applyDb(
        JSON.parse(cached),
        '端末保存データ'
      );
      return;
    }
  }catch(e){
    console.warn(e);
  }

  $('loadStatus').textContent =
    '手動選択してください';
}

document
  .querySelectorAll('.tab')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        document
          .querySelectorAll('.tab')
          .forEach(
            x => x.classList.remove('active')
          );

        button.classList.add('active');

        mode = button.dataset.mode;

        /*
          育成中タブでは
          残り覚醒の少ない順をデフォルトに。
        */
        if(mode === 'training'){
          $('sort').value =
            'remainingAsc';
        }

        render();
      }
    );

  });

['search','property','rarity','sort']
  .forEach(id => {
    $(id).addEventListener(
      id === 'search'
        ? 'input'
        : 'change',
      render
    );
  });

$('clear').addEventListener(
  'click',
  () => {

    $('search').value = '';
    $('property').value = '';
    $('rarity').value = '';
    $('sort').value = 'priority';

    mode = 'all';

    document
      .querySelectorAll('.tab')
      .forEach(
        x => x.classList.remove('active')
      );

    document
      .querySelector(
        '.tab[data-mode="all"]'
      )
      .classList.add('active');

    render();
  }
);

$('fileInput').addEventListener(
  'change',
  async e => {

    const file =
      e.target.files?.[0];

    if(!file) return;

    try{
      applyDb(
        JSON.parse(await file.text()),
        file.name
      );
    }catch(err){
      alert(
        'JSONを読み込めませんでした。\n'
        + err.message
      );
    }
  }
);

$('backTop').addEventListener(
  'click',
  () => {
    scrollTo({
      top:0,
      behavior:'smooth'
    });
  }
);

loadAutomatic();
</script>

</body>
</html>
