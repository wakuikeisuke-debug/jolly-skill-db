<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JOLLY DB v4.1</title><style>

.modalHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalHead button{width:38px;height:38px;border-radius:999px;padding:0}.reason{font-size:12px;line-height:1.55;color:#4b5563;margin-top:6px}.check{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d1d5db;padding:10px;border-radius:12px}.check input{width:auto}.back{position:fixed;right:16px;bottom:18px;width:44px;height:44px;border-radius:999px;background:#111827;color:#fff}@media(max-width:560px){.row{grid-template-columns:1fr}}
</style></head><body><div class="app"><h1>JOLLY DB <span class="small">v4.1 UI</span></h1><div class="controls"><div class="tabs"><button id="tSkills" class="active">スキル</button><button id="tCards">カード</button><button id="tAffinity">相性</button><button id="tStatuses">異常状態</button></div>
<div id="cSkills"><input id="sq" type="search" placeholder="スキル名・効果・タグを検索"><div class="row"><select id="genre"><option value="">全ジャンル</option></select><select id="status"><option value="">全異常状態</option></select></div></div>
<div id="cCards" class="hidden"><input id="cq" type="search" placeholder="カード名・スキル名を検索"><div class="row"><select id="prop"><option value="">全属性</option></select><select id="gender"><option value="">全性別</option></select></div><label class="check"><input id="owned" type="checkbox">保有カードのみ</label></div>
<div id="cAffinity" class="hidden">

<div id="affCardPane">
<input id="aq" type="search" list="cardNames" placeholder="対象カード名を入力・選択"><datalist id="cardNames"></datalist>
<div class="row"><select id="amatch"><option value="match">対象になるスキル</option><option value="outside">対象外のスキル</option></select><select id="adir"><option value="">効果方向すべて</option><option value="positive_for_user">使用側に有利</option><option value="negative_for_user">使用側に不利</option><option value="neutral_or_unknown">中立・未分類</option></select></div>

</div>
<div id="affSkillPane" class="hidden">

<div class="row"><select id="impactFilter"><option value="">実効判定：すべて</option><option value="full">完全に有効</option><option value="partial">一部のみ有効</option><option value="immune">実質無効</option><option value="out">条件外</option></select><select id="defOwned"><option value="">全カード</option><option value="owned">保有カードのみ</option></select></div>
<div class="notice">異常付与スキルは①対象条件、②付与する異常状態、③対象カードの潜在能力による「受け付けない」耐性、④異常ガード無効化の有無を分けて判定します。</div>
</div>
</div>
<div id="cStatuses" class="hidden"><input id="stq" type="search" placeholder="異常状態名・説明を検索"></div></div><div class="meta" id="meta">jolly_card_db_v4.json を読み込み中…</div><div id="results"></div></div>
<div class="modalBg" id="statusModal"><div class="modal"><div class="modalHead"><div><div class="title" id="smTitle"></div><div class="sub" id="smSub"></div></div><button id="smClose">×</button></div><div class="effect" id="smBody" style="margin-top:12px"></div><div class="related" id="smSkills"></div></div></div>
<button class="back" id="back">↑</button><script>
const DB='jolly_card_db_v4.json',$=id=>document.getElementById(id),norm=s=>(s??'').toString().normalize('NFKC').toLowerCase(),esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={cards:[],skills:[],supplemental_skills:[],statuses:[]},mode='skills';
const sname=s=>s.スキル名||s.skill_name||s.original_skill_name||'',seffect=s=>s.効果||s.effect||s.card_effect_raw||'',sgenre=s=>s.ジャンル||s.genre||'',sid=s=>s.ID||s.skill_id||'',srules=s=>Array.isArray(s.target_rules)?s.target_rules:[],allSkills=()=>[...(data.skills||[]),...(data.supplemental_skills||[])];
let affinityMode='card';
const stags=s=>Array.isArray(s.tags)?s.tags:String(s.全タグ||'').split(' / ').filter(Boolean);
const sstatuses=s=>Array.isArray(s.statuses)?s.statuses:String(s.異常状態||'').split(' / ').filter(Boolean);
const statusNames=()=>new Set((data.statuses||[]).map(x=>x.異常状態名).filter(Boolean));
function quotedStatuses(text){const known=statusNames(),out=[];for(const m of String(text||'').matchAll(/[「『]([^」』]+)[」』]/g)){if(known.has(m[1]))out.push(m[1])}return [...new Set(out)]}
function inflictedStatuses(s){return [...new Set([...sstatuses(s),...quotedStatuses(seffect(s))])]}
function cardSkills(c){const a=[...(c.skills||[]),...(c.unlock_skills||[])];for(const x of (c.skill_changes||[])){if(x.to_skill)a.push(x.to_skill)}return a}
function latentImmunities(c){const out=new Set();for(const sk of cardSkills(c)){if(sgenre(sk)!=='潜在能力系')continue;const ef=seffect(sk);if(!ef.includes('受け付けない'))continue;for(const st of quotedStatuses(ef))out.add(st)}return out}
function hasAbnormalGuard(c){return cardSkills(c).some(sk=>stags(sk).some(t=>String(t).includes('異常ガード'))||seffect(sk).includes('異常ガード'))}
function bypassesAbnormalGuard(s){return /異常ガード[^。]*無効/.test(seffect(s))||seffect(s).includes('[異常ガード]類の効果を無効')}
function statusButton(name){return `<button class="statusBtn" onclick="openStatus('${esc(name)}')">${esc(name)}</button>`}
function openStatus(name){const x=(data.statuses||[]).find(s=>s.異常状態名===name);if(!x)return;$('smTitle').textContent=name;$('smSub').textContent=`ID ${x.異常状態ID||''} · 関連スキル ${x.関連スキル数||0}件`;$('smBody').textContent=x.説明||'';$('smSkills').innerHTML=(x.関連スキル||[]).map(n=>`<button class="mini" onclick="closeStatus();jumpSkillName('${esc(n)}')">${esc(n)}</button>`).join('')||'<span class="small">関連スキルなし</span>';$('statusModal').classList.add('open')}
function closeStatus(){$('statusModal').classList.remove('open')}
function jumpSkillName(name){setMode('skills');$('sq').value=name;render();scrollTo({top:0,behavior:'smooth'})}

function dirTag(d){return d==='positive_for_user'?'<span class="tag owned">使用側に有利</span>':d==='negative_for_user'?'<span class="tag neg">使用側に不利</span>':'<span class="tag">中立・未分類</span>'}
function setMode(m){mode=m;for(const x of ['Skills','Cards','Affinity','Statuses']){$('t'+x).classList.toggle('active',m===x.toLowerCase());$('c'+x).classList.toggle('hidden',m!==x.toLowerCase())}render()}
function build(){const gs=[...new Set((data.skills||[]).map(sgenre).filter(Boolean))].sort(),ss=[...new Set((data.statuses||[]).map(x=>x.異常状態名).filter(Boolean))].sort(),ps=data.search_metadata?.properties||[...new Set(data.cards.map(x=>x.property).filter(Boolean))],ge=data.search_metadata?.genders||[...new Set(data.cards.map(x=>x.gender).filter(Boolean))];$('genre').innerHTML='<option value="">全ジャンル</option>'+gs.map(x=>`<option>${esc(x)}</option>`).join('');$('status').innerHTML='<option value="">全異常状態</option>'+ss.map(x=>`<option>${esc(x)}</option>`).join('');$('prop').innerHTML='<option value="">全属性</option>'+ps.map(x=>`<option>${esc(x)}</option>`).join('');$('gender').innerHTML='<option value="">全性別</option>'+ge.map(x=>`<option>${esc(x)}</option>`).join('');$('cardNames').innerHTML=data.cards.map(c=>`<option value="${esc(c.card_name)}"></option>`).join('');$('skillNames').innerHTML=allSkills().map(x=>`<option value="${esc(sname(x))}"></option>`).join('')
function holders(s,ownedOnly=false){const a=(s.cards||[]).filter(x=>!ownedOnly||x.owned);return a.map(x=>`<button class="mini" onclick="jumpCard('${esc(x.card_name)}')">${x.owned?'★ ':''}${esc(x.card_name)}${x.required_item?` / ${esc(x.required_item)}`:''}</button>`).join('')||'<span class="small">なし</span>'}
function skillCard(s){const sts=inflictedStatuses(s).map(statusButton).join('');return `<div class="card"><div class="head"><div><div class="title">${esc(sname(s))}</div><div class="sub">${sid(s)?'ID '+esc(sid(s))+' · ':''}${esc(sgenre(s))}</div></div><button onclick="toggle(this)">詳細</button></div><div class="tags">${dirTag(s.effect_direction)}${sts}</div><div class="effect">${esc(seffect(s))}</div><div class="detail"><b>対象ルール</b>${srules(s).map(r=>`<div class="small">${esc(r.target_type)}: ${esc(r.target_value)} / ${esc(r.relation||'')}</div>`).join('')}<b>このスキルを使えるカード</b><div class="related">${holders(s)}</div></div></div>`}
function allCardSkillNames(c){const a=[];(c.skills||[]).forEach(s=>a.push(sname(s)));(c.unlock_skills||[]).forEach(s=>a.push(sname(s)));(c.skill_changes||[]).forEach(x=>{if(x.from_skill)a.push(sname(x.from_skill));if(x.to_skill)a.push(sname(x.to_skill))});return a.filter(Boolean)}
function cardCard(c){const base=(c.skills||[]).map(s=>`<div><b>${esc(sname(s))}</b><div class="tags">${inflictedStatuses(s).map(statusButton).join('')}</div><div class="small">${esc(seffect(s))}</div></div>`).join(''),un=(c.unlock_skills||[]).map(s=>`<div><b>🔓 ${esc(sname(s))}</b> <span class="tag unlock">${esc(s.required_item_name||'')}</span><div class="tags">${inflictedStatuses(s).map(statusButton).join('')}</div></div>`).join(''),ch=(c.skill_changes||[]).map(x=>`<div><b>🔄 ${esc(sname(x.from_skill||{}))} → ${esc(sname(x.to_skill||{}))}</b> <span class="tag unlock">${esc(x.required_item_name||'')}</span>${x.to_skill?`<div class="tags">${inflictedStatuses(x.to_skill).map(statusButton).join('')}</div>`:''}</div>`).join('');return `<div class="card"><div class="head"><div><div class="title">${c.owned?'★ ':''}${esc(c.card_name)}</div><div class="sub">No.${esc(c.card_no)} · ${esc(c.property)} · ${esc(c.gender||'?')} · ${esc(c.rarity_name||'')}</div></div><button onclick="toggle(this)">詳細</button></div><div class="tags">${c.owned?'<span class="tag owned">保有</span>':''}<span class="tag">${esc(c.property)}</span></div><div class="detail"><div class="small">HP ${esc(c.hp_min)}〜${esc(c.hp_max)} / 攻撃 ${esc(c.attack_min)}〜${esc(c.attack_max)} / 速さ ${esc(c.speed_min)}〜${esc(c.speed_max)}</div><p>${esc(c.description||'')}</p><b>通常スキル</b>${base||'<div class="small">なし</div>'}${un?'<br><b>アイテム解放</b>'+un:''}${ch?'<br><b>アイテム変化</b>'+ch:''}</div></div>`}
function evaluable(r){return ['property','gender','specific_card','skill_name_contains'].includes(r.target_type)}function matchRule(c,r){if(r.target_type==='property')return c.property===r.target_value;if(r.target_type==='gender')return c.gender===r.target_value;if(r.target_type==='specific_card')return String(c.card_no)===String(r.target_card_no||'')||c.card_name===r.target_value;if(r.target_type==='skill_name_contains')return allCardSkillNames(c).some(n=>n.includes(String(r.target_value||'')));return false}
function affinity(){const q=$('aq').value.trim(),alias=data.search_aliases?.cards?.[q],name=alias?.canonical||q,target=data.cards.find(c=>c.card_name===name||c.card_name===q);if(!q)return {target:null,rows:[],empty:true};if(!target)return {target:null,rows:[],empty:false};const want=$('amatch').value==='match',dir=$('adir').value,own=$('aowned').checked,rows=[];for(const s of allSkills()){const rules=srules(s).filter(evaluable);if(!rules.length)continue;const m=rules.some(r=>matchRule(target,r));if(m!==want)continue;if(dir&&s.effect_direction!==dir)continue;const h=(s.cards||[]).filter(x=>!own||x.owned);if(own&&!h.length)continue;rows.push({s,h})}return {target,rows,empty:false}}

function staticScopeRules(s){return srules(s).filter(r=>['property','gender','specific_card','skill_name_contains'].includes(r.target_type))}
function scopeApplies(c,s){const rules=staticScopeRules(s);if(!rules.length)return true;return rules.some(r=>matchRule(c,r))}
function impactOnCard(c,s){
  if(!scopeApplies(c,s))return {kind:'out',label:'条件外',reason:'属性・性別などの対象条件に該当しない',blocked:[],applied:[]};
  const inf=inflictedStatuses(s);
  if(!inf.length)return {kind:'full',label:'対象',reason:'静的な対象条件に該当',blocked:[],applied:[]};
  const imm=latentImmunities(c),blocked=inf.filter(x=>imm.has(x)),applied=inf.filter(x=>!imm.has(x));
  const guard=hasAbnormalGuard(c),bypass=bypassesAbnormalGuard(s);
  let guardNote='';
  if(guard&&bypass)guardNote='。異常ガード類はこのスキルに無効化される';
  else if(guard&&!bypass)guardNote='。異常ガード系スキルも保有';
  if(applied.length===0)return {kind:'immune',label:'実質無効',reason:`潜在能力で ${blocked.join('・')} をすべて受け付けない${guardNote}`,blocked,applied};
  if(blocked.length)return {kind:'partial',label:'一部のみ有効',reason:`無効: ${blocked.join('・')} / 受ける: ${applied.join('・')}${guardNote}`,blocked,applied};
  return {kind:'full',label:'完全に有効',reason:`${inf.join('・')} をすべて受ける${guardNote}`,blocked,applied};
}
function impactBadge(x){const cls=x.kind==='full'?'j-full':x.kind==='partial'?'j-partial':x.kind==='immune'?'j-immune':'j-out';return `<span class="judge ${cls}">${esc(x.label)}</span>`}
function affinityBySkill(){
  const q=$('asq').value.trim(),s=allSkills().find(x=>sname(x)===q);
  if(!q)return {skill:null,rows:[],empty:true};
  if(!s)return {skill:null,rows:[],empty:false};
  const f=$('impactFilter').value,own=$('defOwned').value==='owned',rows=[];
  for(const c of data.cards){if(own&&!c.owned)continue;const impact=impactOnCard(c,s);if(f&&impact.kind!==f)continue;rows.push({c,impact})}
  const order={immune:0,out:1,partial:2,full:3};rows.sort((a,b)=>(order[a.impact.kind]-order[b.impact.kind])||a.c.card_name.localeCompare(b.c.card_name,'ja'));
  return {skill:s,rows,empty:false};
}
function impactCard(x,s){const sts=inflictedStatuses(s).map(statusButton).join('');return `<div class="card"><div class="head"><div><div class="title">${x.c.owned?'★ ':''}${esc(x.c.card_name)}</div><div class="sub">No.${esc(x.c.card_no)} · ${esc(x.c.property)} · ${esc(x.c.gender||'?')}</div></div><button onclick="jumpCard('${esc(x.c.card_name)}')">カード</button></div><div class="tags">${impactBadge(x.impact)}${sts}</div><div class="reason">${esc(x.impact.reason)}</div></div>`}
function render(){const out=$('results');if(mode==='skills'){const q=norm($('sq').value),g=$('genre').value,st=$('status').value,rows=allSkills().filter(s=>(!q||norm([sname(s),seffect(s),sgenre(s),s.全タグ,s.異常状態].join(' ')).includes(q))&&(!g||sgenre(s)===g)&&(!st||String(s.異常状態||'').split(' / ').includes(st)));$('meta').textContent=`${rows.length}件 / 全${allSkills().length}件`;out.innerHTML=rows.slice(0,800).map(skillCard).join('')||'<div class="card">該当なし</div>'}else if(mode==='cards'){const q=norm($('cq').value),p=$('prop').value,g=$('gender').value,o=$('owned').checked,rows=data.cards.filter(c=>(!q||norm([c.card_name,(c.aliases||[]).join(' '),c.description,allCardSkillNames(c).join(' ')].join(' ')).includes(q))&&(!p||c.property===p)&&(!g||c.gender===g)&&(!o||c.owned));$('meta').textContent=`${rows.length}件 / 全${data.cards.length}件`;out.innerHTML=rows.slice(0,500).map(cardCard).join('')||'<div class="card">該当なし</div>'}else if(mode==='affinity'){if(affinityMode==='skill'){const a=affinityBySkill();if(a.empty){$('meta').textContent='スキルを選択してください';out.innerHTML='';return}if(!a.skill){$('meta').textContent='スキル名が見つかりません';out.innerHTML='';return}const sts=inflictedStatuses(a.skill);$('meta').innerHTML=`スキル: ${esc(sname(a.skill))} · ${a.rows.length}カード`+(sts.length?` · 異常: ${sts.map(statusButton).join(' ')}`:'');out.innerHTML=a.rows.slice(0,700).map(x=>impactCard(x,a.skill)).join('')||'<div class="card">該当なし</div>';return}const a=affinity();if(a.empty){$('meta').textContent='対象カードを選択してください';out.innerHTML='';return}if(!a.target){$('meta').textContent='カード名が見つかりません';out.innerHTML='';return}$('meta').textContent=`対象: ${a.target.card_name}（${a.target.property}/${a.target.gender||'?'}） · ${a.rows.length}スキル`;out.innerHTML=a.rows.slice(0,500).map(x=>`<div class="card"><div class="title">${esc(sname(x.s))}</div><div class="tags">${dirTag(x.s.effect_direction)}${inflictedStatuses(x.s).map(statusButton).join('')}</div><div class="effect">${esc(seffect(x.s))}</div><div class="related">${x.h.map(h=>`<button class="mini" onclick="jumpCard('${esc(h.card_name)}')">${h.owned?'★ ':''}${esc(h.card_name)}</button>`).join('')}</div></div>`).join('')||'<div class="card">該当なし</div>'}else{const q=norm($('stq').value),rows=(data.statuses||[]).filter(x=>!q||norm([x.異常状態名,x.説明,(x.関連スキル||[]).join(' ')].join(' ')).includes(q));$('meta').textContent=`${rows.length}件 / 全${rows.length}件`;out.innerHTML=rows.map(x=>`<div class="card"><div class="title">${esc(x.異常状態名)}</div><div class="effect">${esc(x.説明)}</div></div>`).join('')}}
function toggle(b){const c=b.closest('.card');c.classList.toggle('open');b.textContent=c.classList.contains('open')?'閉じる':'詳細'}function jumpCard(name){setMode('cards');$('cq').value=name;$('prop').value='';$('gender').value='';$('owned').checked=false;render();scrollTo({top:0,behavior:'smooth'})}
['sq','cq','aq','asq','stq'].forEach(id=>$(id).addEventListener('input',render));['genre','status','prop','gender','amatch','adir','impactFilter','defOwned'].forEach(id=>$(id).addEventListener('change',render));['owned','aowned'].forEach(id=>$(id).addEventListener('change',render));$('tSkills').onclick=()=>setMode('skills');$('tCards').onclick=()=>setMode('cards');$('tAffinity').onclick=()=>setMode('affinity');$('tStatuses').onclick=()=>setMode('statuses');$('back').onclick=()=>scrollTo({top:0,behavior:'smooth'});
$('affByCard').onclick=()=>{affinityMode='card';$('affByCard').classList.add('active');$('affBySkill').classList.remove('active');$('affCardPane').classList.remove('hidden');$('affSkillPane').classList.add('hidden');render()};
