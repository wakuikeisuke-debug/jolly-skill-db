<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JOLLY DB v4</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;padding:14px 14px 90px}.controls{position:sticky;top:0;z-index:20;background:#f3f4f6;padding:8px 0 10px;display:grid;gap:9px}.tabs{display:flex;gap:8px;overflow:auto}.tabs button,button{border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:10px 12px;font-weight:700}.tabs button.active{background:#111827;color:#fff}input,select{font:inherit;width:100%;border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}.meta{font-size:13px;color:#6b7280;margin:8px 2px}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002}.head{display:flex;justify-content:space-between;gap:10px}.title{font-weight:800;font-size:18px}.sub,.small{font-size:12px;color:#6b7280}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tag{border:1px solid #dbe3ff;background:#eef2ff;border-radius:999px;padding:4px 8px;font-size:12px}.owned{background:#dcfce7;border-color:#bbf7d0}.neg{background:#fef2f2;border-color:#fecaca}.unlock{background:#fff7ed;border-color:#fed7aa}.detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #eee}.card.open .detail{display:block}.effect{white-space:pre-wrap;line-height:1.5}.related{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.mini{border-radius:999px;padding:6px 9px;font-size:12px}.notice{font-size:12px;background:#fffbeb;border:1px solid #fde68a;padding:9px;border-radius:12px;line-height:1.4}.check{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d1d5db;padding:10px;border-radius:12px}.check input{width:auto}.back{position:fixed;right:16px;bottom:18px;width:44px;height:44px;border-radius:999px;background:#111827;color:#fff}@media(max-width:560px){.row{grid-template-columns:1fr}}
</style></head><body><div class="app"><h1>JOLLY DB <span class="small">v4 UI</span></h1><div class="controls"><div class="tabs"><button id="tSkills" class="active">スキル</button><button id="tCards">カード</button><button id="tAffinity">相性</button><button id="tStatuses">異常状態</button></div>
<div id="cSkills"><input id="sq" type="search" placeholder="スキル名・効果・タグを検索"><div class="row"><select id="genre"><option value="">全ジャンル</option></select><select id="status"><option value="">全異常状態</option></select></div></div>
<div id="cCards" class="hidden"><input id="cq" type="search" placeholder="カード名・スキル名を検索"><div class="row"><select id="prop"><option value="">全属性</option></select><select id="gender"><option value="">全性別</option></select></div><label class="check"><input id="owned" type="checkbox">保有カードのみ</label></div>
<div id="cAffinity" class="hidden"><input id="aq" type="search" list="cardNames" placeholder="対象カード名を入力・選択"><datalist id="cardNames"></datalist><div class="row"><select id="amatch"><option value="match">対象になるスキル</option><option value="outside">対象外のスキル</option></select><select id="adir"><option value="">効果方向すべて</option><option value="positive_for_user">使用側に有利</option><option value="negative_for_user">使用側に不利</option><option value="neutral_or_unknown">中立・未分類</option></select></div><label class="check"><input id="aowned" type="checkbox">スキル保有元を自分の保有カードだけに絞る</label><div class="notice">対象外判定は、属性・性別・特定カード・保有スキルなど静的に判定できるルールのみ使用します。</div></div>
<div id="cStatuses" class="hidden"><input id="stq" type="search" placeholder="異常状態名・説明を検索"></div></div><div class="meta" id="meta">jolly_card_db_v4.json を読み込み中…</div><div id="results"></div></div><button class="back" id="back">↑</button><script>
const DB='jolly_card_db_v4.json',$=id=>document.getElementById(id),norm=s=>(s??'').toString().normalize('NFKC').toLowerCase(),esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={cards:[],skills:[],supplemental_skills:[],statuses:[]},mode='skills';
const sname=s=>s.スキル名||s.skill_name||s.original_skill_name||'',seffect=s=>s.効果||s.effect||s.card_effect_raw||'',sgenre=s=>s.ジャンル||s.genre||'',sid=s=>s.ID||s.skill_id||'',srules=s=>Array.isArray(s.target_rules)?s.target_rules:[],allSkills=()=>[...(data.skills||[]),...(data.supplemental_skills||[])];
function dirTag(d){return d==='positive_for_user'?'<span class="tag owned">使用側に有利</span>':d==='negative_for_user'?'<span class="tag neg">使用側に不利</span>':'<span class="tag">中立・未分類</span>'}
function setMode(m){mode=m;for(const x of ['Skills','Cards','Affinity','Statuses']){$('t'+x).classList.toggle('active',m===x.toLowerCase());$('c'+x).classList.toggle('hidden',m!==x.toLowerCase())}render()}
function build(){const gs=[...new Set((data.skills||[]).map(sgenre).filter(Boolean))].sort(),ss=[...new Set((data.statuses||[]).map(x=>x.異常状態名).filter(Boolean))].sort(),ps=data.search_metadata?.properties||[...new Set(data.cards.map(x=>x.property).filter(Boolean))],ge=data.search_metadata?.genders||[...new Set(data.cards.map(x=>x.gender).filter(Boolean))];$('genre').innerHTML='<option value="">全ジャンル</option>'+gs.map(x=>`<option>${esc(x)}</option>`).join('');$('status').innerHTML='<option value="">全異常状態</option>'+ss.map(x=>`<option>${esc(x)}</option>`).join('');$('prop').innerHTML='<option value="">全属性</option>'+ps.map(x=>`<option>${esc(x)}</option>`).join('');$('gender').innerHTML='<option value="">全性別</option>'+ge.map(x=>`<option>${esc(x)}</option>`).join('');$('cardNames').innerHTML=data.cards.map(c=>`<option value="${esc(c.card_name)}"></option>`).join('')}
function holders(s,ownedOnly=false){const a=(s.cards||[]).filter(x=>!ownedOnly||x.owned);return a.map(x=>`<button class="mini" onclick="jumpCard('${esc(x.card_name)}')">${x.owned?'★ ':''}${esc(x.card_name)}${x.required_item?` / ${esc(x.required_item)}`:''}</button>`).join('')||'<span class="small">なし</span>'}
function skillCard(s){return `<div class="card"><div class="head"><div><div class="title">${esc(sname(s))}</div><div class="sub">${sid(s)?'ID '+esc(sid(s))+' · ':''}${esc(sgenre(s))}</div></div><button onclick="toggle(this)">詳細</button></div><div class="tags">${dirTag(s.effect_direction)}</div><div class="effect">${esc(seffect(s))}</div><div class="detail"><b>対象ルール</b>${srules(s).map(r=>`<div class="small">${esc(r.target_type)}: ${esc(r.target_value)} / ${esc(r.relation||'')}</div>`).join('')}<b>このスキルを使えるカード</b><div class="related">${holders(s)}</div></div></div>`}
function allCardSkillNames(c){const a=[];(c.skills||[]).forEach(s=>a.push(sname(s)));(c.unlock_skills||[]).forEach(s=>a.push(sname(s)));(c.skill_changes||[]).forEach(x=>{if(x.from_skill)a.push(sname(x.from_skill));if(x.to_skill)a.push(sname(x.to_skill))});return a.filter(Boolean)}
function cardCard(c){const base=(c.skills||[]).map(s=>`<div><b>${esc(sname(s))}</b><div class="small">${esc(seffect(s))}</div></div>`).join(''),un=(c.unlock_skills||[]).map(s=>`<div><b>🔓 ${esc(sname(s))}</b> <span class="tag unlock">${esc(s.required_item_name||'')}</span></div>`).join(''),ch=(c.skill_changes||[]).map(x=>`<div><b>🔄 ${esc(sname(x.from_skill||{}))} → ${esc(sname(x.to_skill||{}))}</b> <span class="tag unlock">${esc(x.required_item_name||'')}</span></div>`).join('');return `<div class="card"><div class="head"><div><div class="title">${c.owned?'★ ':''}${esc(c.card_name)}</div><div class="sub">No.${esc(c.card_no)} · ${esc(c.property)} · ${esc(c.gender||'?')} · ${esc(c.rarity_name||'')}</div></div><button onclick="toggle(this)">詳細</button></div><div class="tags">${c.owned?'<span class="tag owned">保有</span>':''}<span class="tag">${esc(c.property)}</span></div><div class="detail"><div class="small">HP ${esc(c.hp_min)}〜${esc(c.hp_max)} / 攻撃 ${esc(c.attack_min)}〜${esc(c.attack_max)} / 速さ ${esc(c.speed_min)}〜${esc(c.speed_max)}</div><p>${esc(c.description||'')}</p><b>通常スキル</b>${base||'<div class="small">なし</div>'}${un?'<br><b>アイテム解放</b>'+un:''}${ch?'<br><b>アイテム変化</b>'+ch:''}</div></div>`}
function evaluable(r){return ['property','gender','specific_card','skill_name_contains'].includes(r.target_type)}function matchRule(c,r){if(r.target_type==='property')return c.property===r.target_value;if(r.target_type==='gender')return c.gender===r.target_value;if(r.target_type==='specific_card')return String(c.card_no)===String(r.target_card_no||'')||c.card_name===r.target_value;if(r.target_type==='skill_name_contains')return allCardSkillNames(c).some(n=>n.includes(String(r.target_value||'')));return false}
function affinity(){const q=$('aq').value.trim(),alias=data.search_aliases?.cards?.[q],name=alias?.canonical||q,target=data.cards.find(c=>c.card_name===name||c.card_name===q);if(!q)return {target:null,rows:[],empty:true};if(!target)return {target:null,rows:[],empty:false};const want=$('amatch').value==='match',dir=$('adir').value,own=$('aowned').checked,rows=[];for(const s of allSkills()){const rules=srules(s).filter(evaluable);if(!rules.length)continue;const m=rules.some(r=>matchRule(target,r));if(m!==want)continue;if(dir&&s.effect_direction!==dir)continue;const h=(s.cards||[]).filter(x=>!own||x.owned);if(own&&!h.length)continue;rows.push({s,h})}return {target,rows,empty:false}}
function render(){const out=$('results');if(mode==='skills'){const q=norm($('sq').value),g=$('genre').value,st=$('status').value,rows=allSkills().filter(s=>(!q||norm([sname(s),seffect(s),sgenre(s),s.全タグ,s.異常状態].join(' ')).includes(q))&&(!g||sgenre(s)===g)&&(!st||String(s.異常状態||'').split(' / ').includes(st)));$('meta').textContent=`${rows.length}件 / 全${allSkills().length}件`;out.innerHTML=rows.slice(0,800).map(skillCard).join('')||'<div class="card">該当なし</div>'}else if(mode==='cards'){const q=norm($('cq').value),p=$('prop').value,g=$('gender').value,o=$('owned').checked,rows=data.cards.filter(c=>(!q||norm([c.card_name,(c.aliases||[]).join(' '),c.description,allCardSkillNames(c).join(' ')].join(' ')).includes(q))&&(!p||c.property===p)&&(!g||c.gender===g)&&(!o||c.owned));$('meta').textContent=`${rows.length}件 / 全${data.cards.length}件`;out.innerHTML=rows.slice(0,500).map(cardCard).join('')||'<div class="card">該当なし</div>'}else if(mode==='affinity'){const a=affinity();if(a.empty){$('meta').textContent='対象カードを選択してください';out.innerHTML='';return}if(!a.target){$('meta').textContent='カード名が見つかりません';out.innerHTML='';return}$('meta').textContent=`対象: ${a.target.card_name}（${a.target.property}/${a.target.gender||'?'}） · ${a.rows.length}スキル`;out.innerHTML=a.rows.slice(0,500).map(x=>`<div class="card"><div class="title">${esc(sname(x.s))}</div><div class="tags">${dirTag(x.s.effect_direction)}</div><div class="effect">${esc(seffect(x.s))}</div><div class="related">${x.h.map(h=>`<button class="mini" onclick="jumpCard('${esc(h.card_name)}')">${h.owned?'★ ':''}${esc(h.card_name)}</button>`).join('')}</div></div>`).join('')||'<div class="card">該当なし</div>'}else{const q=norm($('stq').value),rows=(data.statuses||[]).filter(x=>!q||norm([x.異常状態名,x.説明,(x.関連スキル||[]).join(' ')].join(' ')).includes(q));$('meta').textContent=`${rows.length}件 / 全${rows.length}件`;out.innerHTML=rows.map(x=>`<div class="card"><div class="title">${esc(x.異常状態名)}</div><div class="effect">${esc(x.説明)}</div></div>`).join('')}}
function toggle(b){const c=b.closest('.card');c.classList.toggle('open');b.textContent=c.classList.contains('open')?'閉じる':'詳細'}function jumpCard(name){setMode('cards');$('cq').value=name;$('prop').value='';$('gender').value='';$('owned').checked=false;render();scrollTo({top:0,behavior:'smooth'})}
['sq','cq','aq','stq'].forEach(id=>$(id).addEventListener('input',render));['genre','status','prop','gender','amatch','adir'].forEach(id=>$(id).addEventListener('change',render));['owned','aowned'].forEach(id=>$(id).addEventListener('change',render));$('tSkills').onclick=()=>setMode('skills');$('tCards').onclick=()=>setMode('cards');$('tAffinity').onclick=()=>setMode('affinity');$('tStatuses').onclick=()=>setMode('statuses');$('back').onclick=()=>scrollTo({top:0,behavior:'smooth'});
fetch(DB+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(o=>{data=o;build();render()}).catch(e=>{$('meta').textContent='読込失敗: '+e.message+'。index.htmlと同じ場所に jolly_card_db_v4.json を置いてください。'});
</script></body></html>
